# .streamlit/config.toml

[theme]
base = "light"
primaryColor = "#0284C7"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F3F4F6"
textColor = "#1F2937"

# I colori aggiuntivi usati dall'app sono definiti in app/theme.py.
# Streamlit non supporta sezioni [theme.custom] nel config.toml.

