<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="./streamlit-component-lib.js"></script>
  <script defer src="./help.js"></script>
  <script defer src="./main.js"></script>
  <link rel="stylesheet" href="./style.css" />
  <style>
    #temperature-help {
      box-sizing: border-box;
      display: none;
      flex: 0 0 28px;
      width: 28px;
      height: 100%;
      align-items: center;
      justify-content: center;
      border: 0;
      outline: none;
      background: transparent;
      color: inherit;
      padding: 0;
      font: 600 0.78rem -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .number-control.compact-mobile #temperature-help.is-visible {
      display: flex;
    }

    #temperature-help:hover,
    #temperature-help:active {
      background: color-mix(in srgb, var(--text, #31333F) 8%, transparent);
    }

    #temperature-help > span {
      box-sizing: border-box;
      display: inline-flex;
      width: 18px;
      height: 18px;
      align-items: center;
      justify-content: center;
      border: 1px solid color-mix(in srgb, var(--text, #31333F) 58%, transparent);
      border-radius: 50%;
      line-height: 1;
      opacity: 0.8;
    }

    #temperature-help-popup {
      box-sizing: border-box;
      display: none;
      position: absolute;
      top: 44px;
      left: 0;
      right: 0;
      z-index: 20;
      padding: 8px 10px;
      border: 1px solid color-mix(in srgb, var(--text, #31333F) 16%, transparent);
      border-radius: 8px;
      background: var(--field-bg, #F0F2F6);
      color: var(--text, #31333F);
      font: 400 0.78rem/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      box-shadow: 0 2px 8px color-mix(in srgb, var(--text, #31333F) 12%, transparent);
    }

    #temperature-help-popup.is-open {
      display: block;
    }

    html.help-open,
    html.help-open body {
      height: auto;
      min-height: 40px;
      overflow: visible;
    }
  </style>
</head>
<body>
  <div id="number-control" class="number-control">
    <span id="mobile-label" class="mobile-label"></span>
    <button id="temperature-help" type="button" aria-label="Informazioni sulla temperatura ambientale" aria-expanded="false"><span>?</span></button>
    <input id="number-input" type="text" inputmode="decimal" autocomplete="off" />
    <span id="mobile-unit" class="mobile-unit"></span>
    <button id="number-minus" class="step-button" type="button" aria-label="Diminuisci">−</button>
    <button id="number-plus" class="step-button" type="button" aria-label="Aumenta">+</button>
    <button id="suggest-action" class="suggest-button" type="button" aria-label="Suggerisci fattore di correzione"></button>
  </div>
  <div id="temperature-help-popup" role="note"></div>
</body>
</html>
