<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="./streamlit-component-lib.js"></script>
  <script defer src="./main.js"></script>
  <script>
    (() => {
      try {
        const doc = window.parent && window.parent !== window
          ? window.parent.document
          : null;
        if (!doc || !doc.head) return;

        const styleId = "mortem-decimal-responsive-overrides";
        let style = doc.getElementById(styleId);
        if (!style) {
          style = doc.createElement("style");
          style.id = styleId;
          doc.head.appendChild(style);
        }

        style.textContent = `
          @media (max-width: 768px) {
            .mortem-decimal-hide-mobile {
              display: none !important;
            }

            html body [data-testid="stVerticalBlock"].mortem-decimal-compact-stack {
              gap: clamp(0.22rem, 1vw, 0.34rem) !important;
            }

            html body [data-testid="stHorizontalBlock"].mortem-decimal-compact-row {
              gap: clamp(0.10rem, 0.7vw, 0.18rem) !important;
              row-gap: clamp(0.10rem, 0.7vw, 0.18rem) !important;
            }

            html body [data-testid="stHorizontalBlock"].mortem-decimal-weight-inline {
              display: grid !important;
              grid-template-columns: minmax(0, 1fr) max-content !important;
              align-items: center !important;
              column-gap: clamp(0.10rem, 0.7vw, 0.22rem) !important;
              row-gap: 0 !important;
              width: 100% !important;
              min-width: 0 !important;
            }

            html body [data-testid="stHorizontalBlock"].mortem-decimal-weight-inline > [data-testid="column"] {
              width: auto !important;
              max-width: none !important;
              min-width: 0 !important;
              margin: 0 !important;
              padding: 0 !important;
            }

            html body [data-testid="stHorizontalBlock"].mortem-decimal-weight-inline > [data-testid="column"]:first-child {
              grid-column: 1 !important;
              grid-row: 1 !important;
            }

            html body [data-testid="stHorizontalBlock"].mortem-decimal-weight-inline > [data-testid="column"]:nth-child(2) {
              grid-column: 2 !important;
              grid-row: 1 !important;
              justify-self: end !important;
              width: max-content !important;
              max-width: max-content !important;
            }

            html body [data-testid="stHorizontalBlock"].mortem-decimal-weight-inline > [data-testid="column"]:nth-child(2)
            [data-testid="stVerticalBlock"] {
              gap: 0 !important;
              width: max-content !important;
            }

            html body [data-testid="stHorizontalBlock"].mortem-decimal-weight-inline > [data-testid="column"]:nth-child(2)
            [data-testid="stToggle"] {
              width: max-content !important;
              margin: 0 !important;
              padding: 0 !important;
            }

            html body [data-testid="stHorizontalBlock"].mortem-decimal-weight-inline > [data-testid="column"]:nth-child(2)
            label {
              width: max-content !important;
              gap: clamp(0.18rem, 0.8vw, 0.30rem) !important;
              white-space: nowrap !important;
              margin: 0 !important;
              padding: 0 !important;
              font-size: clamp(0.72rem, 3.2vw, 0.90rem) !important;
            }

            /* Responsive solo per il pannello FC della schermata completa.
               I prefissi fcpanel_std/fcpanel_caut non sono usati dalla MSIL,
               che continua a utilizzare fcpanel_mobile e il proprio layout. */
            html body [data-testid="stVerticalBlockBorderWrapper"]:has([class*="st-key-fcpanel_std_radio_stato_corpo"])
            [data-testid="stVerticalBlock"],
            html body [data-testid="stVerticalBlockBorderWrapper"]:has([class*="st-key-fcpanel_caut_radio_stato_corpo"])
            [data-testid="stVerticalBlock"] {
              gap: clamp(0.25rem, 1.2vw, 0.45rem) !important;
            }

            html body [data-testid="stVerticalBlockBorderWrapper"]:has([class*="st-key-fcpanel_std_radio_stato_corpo"])
            [data-testid="stRadio"],
            html body [data-testid="stVerticalBlockBorderWrapper"]:has([class*="st-key-fcpanel_caut_radio_stato_corpo"])
            [data-testid="stRadio"],
            html body [data-testid="stVerticalBlockBorderWrapper"]:has([class*="st-key-fcpanel_std_radio_stato_corpo"])
            [data-testid="stToggle"],
            html body [data-testid="stVerticalBlockBorderWrapper"]:has([class*="st-key-fcpanel_caut_radio_stato_corpo"])
            [data-testid="stToggle"] {
              margin: 0 !important;
              padding: 0 !important;
            }

            html body [data-testid="stVerticalBlockBorderWrapper"]:has([class*="st-key-fcpanel_std_radio_stato_corpo"])
            div[role="radiogroup"],
            html body [data-testid="stVerticalBlockBorderWrapper"]:has([class*="st-key-fcpanel_caut_radio_stato_corpo"])
            div[role="radiogroup"] {
              display: flex !important;
              flex-wrap: wrap !important;
              gap: clamp(0.18rem, 1vw, 0.35rem) !important;
            }

            html body [data-testid="stHorizontalBlock"]:has([class*="st-key-fcpanel_std_toggle_vestito"]),
            html body [data-testid="stHorizontalBlock"]:has([class*="st-key-fcpanel_caut_toggle_vestito"]) {
              display: flex !important;
              flex-wrap: nowrap !important;
              align-items: center !important;
              gap: clamp(0.20rem, 1vw, 0.35rem) !important;
            }

            html body [data-testid="stHorizontalBlock"]:has([class*="st-key-fcpanel_std_toggle_vestito"])
            > [data-testid="column"],
            html body [data-testid="stHorizontalBlock"]:has([class*="st-key-fcpanel_caut_toggle_vestito"])
            > [data-testid="column"] {
              flex: 1 1 0 !important;
              min-width: 0 !important;
              width: auto !important;
              margin: 0 !important;
              padding: 0 !important;
            }

            html body [data-testid="stVerticalBlockBorderWrapper"]:has([class*="st-key-fcpanel_std_radio_stato_corpo"])
            [data-testid="stSelectbox"] > label,
            html body [data-testid="stVerticalBlockBorderWrapper"]:has([class*="st-key-fcpanel_caut_radio_stato_corpo"])
            [data-testid="stSelectbox"] > label {
              margin-bottom: 0.15rem !important;
              font-size: clamp(0.78rem, 3.2vw, 0.90rem) !important;
            }

            html body [data-testid="stVerticalBlockBorderWrapper"]:has([class*="st-key-fcpanel_std_radio_stato_corpo"])
            [data-testid="stButton"] button,
            html body [data-testid="stVerticalBlockBorderWrapper"]:has([class*="st-key-fcpanel_caut_radio_stato_corpo"])
            [data-testid="stButton"] button {
              min-height: 2.2rem !important;
            }
          }
        `;

        const frame = window.frameElement;

        function parentElementContainer() {
          if (!frame) return null;
          return frame.closest('[data-testid="stElementContainer"]') || frame.parentElement;
        }

        function ancestorHorizontalRows(start) {
          const rows = [];
          let node = start;
          while (node && node !== doc.body) {
            if (node.matches && node.matches('[data-testid="stHorizontalBlock"]')) {
              rows.push(node);
            }
            node = node.parentElement;
          }
          return rows;
        }

        function previousTextElement(start) {
          let node = start;
          for (let depth = 0; node && depth < 6; depth += 1, node = node.parentElement) {
            let sibling = node.previousElementSibling;
            while (sibling) {
              if (
                sibling.matches &&
                sibling.matches('[data-testid="stElementContainer"]') &&
                String(sibling.textContent || "").trim()
              ) {
                return sibling;
              }
              if (sibling.querySelectorAll) {
                const nested = Array.from(
                  sibling.querySelectorAll('[data-testid="stElementContainer"]')
                ).reverse().find((element) => String(element.textContent || "").trim());
                if (nested) return nested;
              }
              sibling = sibling.previousElementSibling;
            }
          }
          return null;
        }

        function reinforcePrudentHeading() {
          if (Number(window.parent.innerWidth) > 768) return;
          const control = document.getElementById("number-control");
          const labelNode = document.getElementById("mobile-label");
          if (!control || !labelNode || !control.classList.contains("compact-mobile")) return;

          const compactLabel = String(labelNode.textContent || "").trim().toLowerCase();
          const needsGroupHeadingHide = (
            compactLabel === "peso" ||
            compactLabel.startsWith("t. amb.") ||
            compactLabel === "fc" ||
            compactLabel.startsWith("fc ")
          );
          if (!needsGroupHeadingHide) return;

          const current = parentElementContainer();
          if (!current) return;
          const rows = ancestorHorizontalRows(current);
          const start = rows.length ? rows[0] : current;
          const candidate = previousTextElement(start);
          if (candidate) candidate.classList.add("mortem-decimal-hide-mobile");
        }

        [40, 120, 300, 700].forEach((delay) => {
          window.setTimeout(reinforcePrudentHeading, delay);
        });
      } catch (_) {
        // Il componente continua a funzionare anche se il parent non è accessibile.
      }
    })();
  </script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="number-control" class="number-control">
    <span id="mobile-label" class="mobile-label"></span>
    <input id="number-input" type="text" inputmode="decimal" autocomplete="off" />
    <span id="mobile-unit" class="mobile-unit"></span>
    <button id="number-minus" class="step-button" type="button" aria-label="Diminuisci">−</button>
    <button id="number-plus" class="step-button" type="button" aria-label="Aumenta">+</button>
  </div>
</body>
</html>
