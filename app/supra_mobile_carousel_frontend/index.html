<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <style>
    :root {
      --primary: #168AC1;
      --bg: #F0F2F6;
      --text: #31333F;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow: hidden;
    }
    .shell {
      width: 100%;
      margin: 0;
      padding: 0;
    }
    .viewport {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-inline: contain;
      touch-action: pan-x;
    }
    .viewport::-webkit-scrollbar { display: none; }
    .track {
      display: flex;
      align-items: center;
      gap: 0.32rem;
      padding-inline: 14%;
      min-width: 100%;
    }
    .card {
      flex: 0 0 72%;
      height: 118px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid transparent;
      border-radius: 0.55rem;
      background: #FFFFFF;
      scroll-snap-align: center;
      scroll-snap-stop: normal;
      opacity: 0.58;
      transform: scale(0.90);
      transition: transform 120ms ease, opacity 120ms ease, border-color 120ms ease;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
    }
    .card.active {
      opacity: 1;
      transform: scale(1);
      border: 2px solid var(--primary);
    }
    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #FFFFFF;
      pointer-events: none;
    }
    .meta {
      min-height: 42px;
      padding: 0.18rem 0.35rem 0;
      text-align: center;
    }
    .label {
      min-height: 28px;
      margin: 0;
      white-space: pre-line;
      line-height: 1.08;
      font-size: 0.74rem;
      font-weight: 650;
    }
    .counter {
      margin-top: 0.08rem;
      font-size: 0.62rem;
      line-height: 1;
      opacity: 0.62;
    }
  </style>
</head>
<body>
  <div class="shell">
    <div id="viewport" class="viewport" role="listbox" aria-label="Eccitabilità elettrica sopraciliare">
      <div id="track" class="track"></div>
    </div>
    <div class="meta">
      <div id="label" class="label"></div>
      <div id="counter" class="counter"></div>
    </div>
  </div>

  <script>
    function sendMessageToStreamlitClient(type, data) {
      const outData = Object.assign({ isStreamlitMessage: true, type }, data);
      window.parent.postMessage(outData, "*");
    }

    const Streamlit = {
      setComponentReady() {
        sendMessageToStreamlitClient("streamlit:componentReady", { apiVersion: 1 });
      },
      setFrameHeight(height) {
        sendMessageToStreamlitClient("streamlit:setFrameHeight", { height });
      },
      setComponentValue(value) {
        sendMessageToStreamlitClient("streamlit:setComponentValue", { value });
      },
      RENDER_EVENT: "streamlit:render",
      events: {
        addEventListener(type, callback) {
          window.addEventListener("message", (event) => {
            if (event.data.type === type) {
              event.detail = event.data;
              callback(event);
            }
          });
        }
      }
    };

    const viewport = document.getElementById("viewport");
    const track = document.getElementById("track");
    const label = document.getElementById("label");
    const counter = document.getElementById("counter");

    let items = [];
    let activeIndex = 0;
    let committedValue = null;
    let pendingValue = null;
    let initialized = false;
    let renderSignature = "";
    let settleTimer = null;
    let ignoreScrollUntil = 0;
    const supportsScrollEnd = "onscrollend" in viewport;

    function cards() {
      return Array.from(track.querySelectorAll(".card"));
    }

    function updateMeta() {
      const item = items[activeIndex];
      label.textContent = item ? item.label || "" : "";
      counter.textContent = item ? `${activeIndex + 1} / ${items.length}` : "";
    }

    function paintActive() {
      cards().forEach((card, index) => {
        const active = index === activeIndex;
        card.classList.toggle("active", active);
        card.setAttribute("aria-selected", active ? "true" : "false");
      });
      updateMeta();
    }

    function scrollToIndex(index, behavior = "smooth") {
      const card = cards()[index];
      if (!card) return;
      const left = card.offsetLeft - (viewport.clientWidth - card.clientWidth) / 2;
      viewport.scrollTo({ left, behavior });
    }

    function setActive(index) {
      if (!items.length) return;
      activeIndex = Math.max(0, Math.min(items.length - 1, index));
      paintActive();
    }

    function nearestIndex() {
      const list = cards();
      if (!list.length) return 0;
      const center = viewport.scrollLeft + viewport.clientWidth / 2;
      let bestIndex = 0;
      let bestDistance = Infinity;
      list.forEach((card, index) => {
        const cardCenter = card.offsetLeft + card.offsetWidth / 2;
        const distance = Math.abs(cardCenter - center);
        if (distance < bestDistance) {
          bestDistance = distance;
          bestIndex = index;
        }
      });
      return bestIndex;
    }

    function commitIndex(index) {
      if (!items.length) return;
      setActive(index);
      const item = items[activeIndex];
      if (!item || item.value === committedValue) return;
      committedValue = item.value;
      pendingValue = item.value;
      Streamlit.setComponentValue(item.value);
    }

    function settleCurrentPosition() {
      window.clearTimeout(settleTimer);
      settleTimer = null;
      if (performance.now() < ignoreScrollUntil) return;

      const index = nearestIndex();
      setActive(index);
      scrollToIndex(index, "auto");
      commitIndex(index);
    }

    function scheduleFallbackSettle() {
      if (supportsScrollEnd || performance.now() < ignoreScrollUntil) return;
      window.clearTimeout(settleTimer);
      settleTimer = window.setTimeout(settleCurrentPosition, 180);
    }

    viewport.addEventListener("scroll", () => {
      setActive(nearestIndex());
      scheduleFallbackSettle();
    }, { passive: true });

    if (supportsScrollEnd) {
      viewport.addEventListener("scrollend", settleCurrentPosition, { passive: true });
    }

    function rebuildCards() {
      track.replaceChildren();
      items.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.setAttribute("role", "option");
        card.dataset.index = String(index);
        card.setAttribute("aria-label", item.label || item.value || "");

        const image = document.createElement("img");
        image.src = item.image;
        image.alt = "";
        image.draggable = false;
        card.appendChild(image);

        card.addEventListener("click", () => {
          window.clearTimeout(settleTimer);
          setActive(index);
          if (index === nearestIndex()) {
            commitIndex(index);
            return;
          }
          scrollToIndex(index, "smooth");
          if (!supportsScrollEnd) {
            settleTimer = window.setTimeout(settleCurrentPosition, 220);
          }
        });
        track.appendChild(card);
      });
    }

    function applyIncomingValue(incoming, shouldScroll) {
      const incomingIndex = items.findIndex((item) => item.value === incoming);
      if (incomingIndex < 0) return false;
      activeIndex = incomingIndex;
      committedValue = incoming;
      paintActive();
      if (shouldScroll) {
        ignoreScrollUntil = performance.now() + 220;
        requestAnimationFrame(() => scrollToIndex(activeIndex, "auto"));
      }
      return true;
    }

    function onRender(event) {
      const args = event.detail.args || {};
      document.documentElement.style.setProperty("--primary", args.primary_color || "#168AC1");
      document.documentElement.style.setProperty("--bg", args.background_color || "#F0F2F6");
      document.documentElement.style.setProperty("--text", args.text_color || "#31333F");

      const nextItems = Array.isArray(args.items) ? args.items : [];
      const signature = nextItems.map((item) => `${item.value}|${item.label}|${(item.image || "").length}`).join(";");
      items = nextItems;

      const rebuilt = signature !== renderSignature;
      if (rebuilt) {
        renderSignature = signature;
        rebuildCards();
      }

      const incoming = typeof args.value === "string" ? args.value : null;

      if (!initialized) {
        initialized = true;
        if (!applyIncomingValue(incoming, true)) {
          activeIndex = 0;
          committedValue = items[0] ? items[0].value : null;
          paintActive();
          ignoreScrollUntil = performance.now() + 220;
          requestAnimationFrame(() => scrollToIndex(activeIndex, "auto"));
        }
      } else if (pendingValue !== null) {
        if (incoming === pendingValue) {
          pendingValue = null;
          committedValue = incoming;
        }
        paintActive();
        if (rebuilt) {
          ignoreScrollUntil = performance.now() + 220;
          requestAnimationFrame(() => scrollToIndex(activeIndex, "auto"));
        }
      } else if (incoming !== null && incoming !== committedValue) {
        applyIncomingValue(incoming, true);
      } else {
        paintActive();
        if (rebuilt) {
          ignoreScrollUntil = performance.now() + 220;
          requestAnimationFrame(() => scrollToIndex(activeIndex, "auto"));
        }
      }

      Streamlit.setFrameHeight(168);
    }

    Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, onRender);
    Streamlit.setComponentReady();
    Streamlit.setFrameHeight(168);
  </script>
</body>
</html>
