<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="./streamlit-component-lib.js"></script>
  <script defer src="./main.js"></script>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <button id="time-display" type="button" aria-haspopup="dialog" aria-expanded="false">
    <span id="time-value">00:00</span>
    <span class="chevron">⌄</span>
  </button>

  <div id="picker" class="picker" hidden>
    <div class="picker-title">Ora</div>
    <div class="wheel-wrap">
      <div class="wheel-column">
        <div class="wheel-label">Ore</div>
        <div id="hours-wheel" class="wheel" role="listbox" aria-label="Ore"></div>
      </div>
      <div class="separator">:</div>
      <div class="wheel-column">
        <div class="wheel-label">Minuti</div>
        <div id="minutes-wheel" class="wheel" role="listbox" aria-label="Minuti"></div>
      </div>
    </div>
    <div class="picker-actions">
      <button id="cancel-button" type="button" class="action secondary">Annulla</button>
      <button id="set-button" type="button" class="action primary">Imposta</button>
    </div>
  </div>
</body>
</html>
