<!-- FC: vestizione e aria, poi appoggio, peso e arrotondamento.
Intervalli dell’app distinti dalle fonti. Componente integrato nell’app.
Formula peso: Henssge, in Madea, 3a ed., eq. 6.10, trascrizione consultata.
Coefficiente -3.24596: verificato visivamente nell’equazione 6.10 della 3a edizione (2016).
FC >= 1.40 e peso < 60 oppure > 80 kg; arrotondamento finale al più vicino 0.05.
Estensione oltre FC 3 approvata per questa prova, non validazione sperimentale. -->

<script>
(()=>{
const root=document.getElementById('fc-full'),q=s=>root.querySelector(s),table=JSON.parse(q('#weight-data').textContent);let state='',suggestion=null,result=null,manual=false,preset=false,applied=null,manualBase=null,manualWeightAdjusted=false,lastWeight=null,selectedBase=null,weightAdjusted=false,rangeExpanded=false,weightValue=NaN,weightDisplay=null;
const fmt=n=>n.toFixed(2);
// Quantization is an app output convention, never a change to source values.
function roundFC(v){return Number((Math.round(v*20+1e-10)/20).toFixed(2));}
function roundRange(r){return r.map(v=>roundFC(v));}
function onFCGrid(v){return Math.abs(v*20-Math.round(v*20))<1e-8;}
function normalizeChoice(){for(const id of ['lo','hi']){const el=q('#'+id),v=num(el);if(Number.isFinite(v))el.value=fmt(roundFC(v));}}
function setWeight(value){weightValue=value;weightDisplay=Number.isFinite(value)?value.toFixed(0):'';q('#weight').value=weightDisplay;}
const num=el=>{if(el.id==='weight'&&el.value===weightDisplay)return weightValue;const s=el.value.trim().replace(',','.');return /^\d+(\.\d{1,2})?$/.test(s)?Number(s):NaN;};
const specs=[['thin','Leggeri',0],['thick','Pesanti',0],['medium','Spesse',0],['heavy','Molto pesanti / piumoni',0]];
function step(id,label,value,delta,group){const wrap=document.createElement('div');wrap.id=id+'-control';wrap.className='counter';wrap.innerHTML='<label for="'+id+'">'+label+'</label><div class="step"><input id="'+id+'" type="text" inputmode="decimal" value="'+value+'"><button data-input="'+id+'" data-step="-'+delta+'" aria-label="Diminuisci '+label+'">−</button><button data-input="'+id+'" data-step="'+delta+'" aria-label="Aumenta '+label+'">+</button></div>';q(group).append(wrap);}
specs.forEach(([id,l,v],i)=>{
  step(id,l,v,1,i<2?'#clothing-counts':'#blanket-counts');q('#'+id).setAttribute('inputmode','numeric');
});
const counters=window.FCCounters({root,q,num,step,recalc});
step('lo','FC minimo','1.80',.05,'#range-fields');
step('hi','FC massimo','2.00',.05,'#range-fields');
q('label[for="lo"]').textContent='min';q('#lo').setAttribute('aria-label','FC minimo');
q('label[for="hi"]').textContent='max';q('#hi').setAttribute('aria-label','FC massimo');
for(const id of ['lo','hi']){
  const marker=document.createElement('sup');marker.id=id+'-note-marker';marker.className='fc-note-marker';
  marker.textContent='*';marker.hidden=true;marker.setAttribute('aria-hidden','true');q('#'+id+'-control').append(marker);
  q('#'+id).setAttribute('aria-describedby','fc-selection-note');
}
function temperatureValue(){const raw=q('#scenario-temperature').value.trim().replace(',','.');return /^-?\d+(\.\d{1,2})?$/.test(raw)?Number(raw):NaN;}
function waterNearZero(){const temperature=temperatureValue();return state==='Immerso'&&q('#water').value==='stagnante'&&Number.isFinite(temperature)&&temperature<=1;}
function data(){const air=q('#air').value,surface=q('#surface').value,metalType=q('#metal-type').value;return {...counters.details(),thermalFoil:!!q('#thermal-foil').checked,bodyBag:!!q('#body-bag').checked,s:num(q('#thin')),p:num(q('#thick'))+Number(!!q('#body-bag').checked),m:num(q('#medium'))+Number(!!q('#thermal-foil').checked),h:num(q('#heavy')),surf:surface==='metal'?(metalType===''?null:Number(metalType)):surface==='wood'?0:Number(surface),waterNearZero:waterNearZero(),air,wind:air==='continuous',isolation:q('#isolation').value,volume:q('#blanket-volume').value,feather:q('#feather').value,leaf:q('#leaf').value,leafCover:q('#leaf-cover').value,supportSoaked:q('#support-soaked').value,wetCase:q('#wet-case').checked};}
function validCounts(c){return [c.s,c.p,c.m,c.h,...(c.garmentThin===undefined?[]:[c.garmentThin,c.garmentThick,c.teli,c.lightCover])].every(v=>Number.isInteger(v)&&v>=0&&v<=20);}
const SOURCES = {
  thermalCover: {short:'Henriksson et al., 2009 · studio su manichino, analogia per le coperture.',full:'Henriksson O, Lundgren JP, Kuklane K, Holmér I, Bjornstig U. Protection against cold in prehospital care—thermal insulation properties of blankets and rescue bags in different wind conditions. Prehosp Disaster Med. 2009;24(5):408–415. doi:10.1017/S1049023X00007238. L’assimilazione del sacco mortuario a un telo pesante è una valutazione degli autori dell’app; lo studio non attribuisce un FC cadaverico al sacco mortuario.',url:'https://doi.org/10.1017/S1049023X00007238'},
  waterExperiments: {"short": "Henssge, Brinkmann e Püschel, 1984 · immersione in acqua quasi ferma.", "full": "Henssge C, Brinkmann B, Püschel K. Determination of time of death by measuring the rectal temperature in corpses suspended in water. Z Rechtsmed. 1984;92:255–276. doi:10.1007/BF00200284. Dati consultati in Henssge, in Madea (ed.), Estimation of the Time Since Death, 3ª ed., 2016, cap. 6.1, tab. 6.7. Le prove distinguono acqua a circa 10–20 °C e prossima a 0 °C. Riguardano corpi nudi sospesi in acqua quasi ferma; non verificano tutte le condizioni di immersione.", "url": "https://doi.org/10.1007/BF00200284"},
  flowingWater: {"short": "Henssge in Madea, 2016 · acqua corrente.", "full": "Henssge C. Basics and application of the nomogram method at the scene. In: Madea B (ed.), Estimation of the Time Since Death, 3ª ed., 2016, cap. 6.1, sezione sull’immersione. Henssge discute una prova di Brown e Marshall su un corpo molto piccolo, in acqua in movimento a circa 5 m/ora, ricondotta a un FC di circa 0.35. È un’osservazione limitata, distinta dalla serie in acqua quasi ferma della tab. 6.7; non consente di generalizzare a ogni corrente."},

  duvet: {"short": "Henssge, 1992 · coperture di piume; Madea, 2016, tab. 6.20.", "full": "Henssge C. Forensic Sci Int. 1992;54(1):51–66. doi:10.1016/0379-0738(92)90080-G. Ripreso in Henssge C. Basics and application of the nomogram method at the scene. In: Madea B (ed.), Estimation of the Time Since Death, 3ª ed., CRC Press, 2016, cap. 6.1, tab. 6.20. La tabella riporta i riferimenti 2.80 e 3.00 a 70 kg per le condizioni più isolanti con coperture di piume. Il loro uso come intervallo per la domanda dell’app è un’interpretazione dell’app.", "url": "https://doi.org/10.1016/0379-0738(92)90080-G"},
  wetNakedAccelerating: {short:'App · nudo bagnato su appoggio disperdente.',full:'Intervallo convenzionale dell’app: 0.60–0.75 per il nudo bagnato su cemento/pietra, piastrelle molto fredde o PVC, sia in aria ferma sia mobile. Nelle fonti consultate non sono state individuate indicazioni specifiche sufficienti per quantificare separatamente queste combinazioni. Il minimo 0.60 non è un limite sperimentale né deriva dai valori dell’immersione.'},
  coldWater: {"short": "Henssge, Brinkmann e Püschel, 1984 · esperimenti in acqua.", "full": "Henssge C, Brinkmann B, Püschel K. Z Rechtsmed. 1984;92(4):255–276. doi:10.1007/BF00200284. Dati consultati in Henssge C. Basics and application of the nomogram method at the scene. In: Madea B (ed.), Estimation of the Time Since Death, 3ª ed., CRC Press, 2016, cap. 6.1, tab. 6.7. Il range 0.50–1.00 per acqua stagnante prossima a 0 °C è la proposta dell’app basata sulla variabilità sperimentale; non è una nuova categoria della tabella originale. L’attivazione automatica a temperatura ≤ 1 °C è una soglia scelta per l’app.", "url": "https://doi.org/10.1007/BF00200284"},
  soakedMattress: {short:'App · imbottiture impregnate, analogia con Althaus et al., 2007.',full:'Per analogia con le foglie bagnate, nessuna maggiorazione isolante per materasso o divano impregnati. L’assimilazione non è stata verificata sperimentalmente sulle imbottiture.'},
  wetMixed: {short:'App · classificazione degli strati bagnati.',full:'Classificazione proposta dall’app: due strati leggeri sono considerati simili a uno pesante. Non è una relazione di Henssge. Riferimenti: tab. 6.8, un camice bagnato 1.00; tab. 6.18, due strati pesanti bagnati 1.10 e più di due 1.20 in aria ferma, almeno due 0.90 in aria mobile. I range intermedi sono ipotesi dell’app, non intervalli pubblicati.'},
  wetBlankets: {short:'App · coperture completamente bagnate.',full:'Nelle fonti consultate non sono state individuate indicazioni specifiche per tutte le combinazioni di coperture selezionabili. L’app le assimila alle classi di isolamento bagnato. Un piumone è assimilato a più di due strati pesanti; una coperta singola ha un intervallo più ampio. L’assimilazione non è dimostrata sperimentalmente. Non vengono sommati incrementi per ciascuna coperta.'},
  wetLayers: {short:'Henssge e Brinkmann, 1984 · casi 51 e 44.',full:'Stessa descrizione: mutanda contenitiva, pantaloni e tre camici bagnati. FC 1.10 a 69.5 kg e 1.30 a 65 kg. Questi risultati non identificano il numero di strati pesanti e non validano direttamente le coperture.'},
  wetGarments: {short:'Henssge e Brinkmann, 1984 · esperimenti con indumenti bagnati.',full:'Madea, 3ª ed., 2016, cap. 6.1, tab. 6.8, Henssge e Brinkmann, 1984: caso 41, un camice bagnato, FC 1.00; caso 42, due camici bagnati, FC 1.10. Un camice sperimentale non equivale a qualsiasi strato leggero. Il range 0.90–1.00 è una proposta dell’app.'},
  wetCasework: {"short": "Henssge et al., 2000 · casi della pratica medico-legale 15 e 22.", "full": "Henssge et al. Int J Legal Med. 2000;113(6):303–319. doi:10.1007/s004149900089. Dati consultati in Henssge C. Basics and application of the nomogram method at the scene. In: Madea B (ed.), Estimation of the Time Since Death, 3ª ed., CRC Press, 2016, cap. 6.1, tab. 6.17: caso 15, pantaloni da tuta e slip fradici, su strada, pioggia e correnti d’aria, 76 kg; caso 22, pantaloni da lavoro e slip fradici, su terreno, vento e pioggia, 93 kg. Entrambi: FC scelto 0.70, range 0.60–0.80. L’appoggio è già compreso. Sono scelte documentate in casi reali, non valori misurati sperimentalmente.", "url": "https://doi.org/10.1007/s004149900089"},

function isMany(c){return c.p>=3||(c.p>=1&&c.s>=3)||(c.p===0&&c.s>=5);}
function decision(id,range,kind,summary,sources,detail='',reference=null){return {id,range,kind,summary,sources,detail,reference:reference||(range?rangeText(range):'Non definito')};}
function rangeText(range){return range[0]===range[1]?fmt(range[0]):range.map(fmt).join(' - ');}
function pending(reason,sources=['henssge'],reference='Non definito'){return decision('manual',null,'Valutazione manuale',reason,sources,'Inserire entrambi gli estremi. Non viene usata una formula sostitutiva.',reference);}
function wetBlanketDecision(c){
  let range,reason;
  if(c.wind){
    const substantial=c.h>0||c.m>=2||c.p>=1||c.s>=2;
    range=substantial?[.9,.9]:[.7,.9];
    reason=substantial?'L’app assimila la copertura e gli eventuali indumenti alla categoria bagnata di almeno due strati pesanti in aria mobile, con riferimento 0.90.':'L’app propone l’intervallo fra 0.70, riferimento per protezione scarsa, e 0.90, riferimento per almeno due strati pesanti bagnati in aria mobile.';
  }else if(c.h>0||c.m>=3||(c.m===2&&(c.p>=1||c.s>=2))||(c.m===1&&c.p>=2)){
    range=[1.2,1.3];reason='L’app parte dal valore 1.20 riportato nella tabella di Henssge per più di due strati pesanti bagnati e amplia il massimo a 1.30 per la variabilità dell’isolamento. L’assimilazione delle coperture è un ragionamento dell’app.';
  }else if(c.m===2||c.p>=1||c.s>=2){
    range=[1.1,1.2];reason='L’app propone l’intervallo tra i valori riportati nella tabella di Henssge per due strati pesanti bagnati (1.10) e per più di due (1.20), senza correnti d’aria.';
  }else{
    range=[1,1.1];reason='L’app propone l’intervallo tra il valore 1.00 osservato con un camice bagnato negli esperimenti descritti da Henssge e il valore 1.10 riportato nella tabella di Henssge per due strati pesanti bagnati senza correnti d’aria.';
  }
  return decision('wet-blanket'+(c.wind?'-wind':'-still'),range,'Ragionamento dell’app','Coperture completamente bagnate: classificazione proposta dall’app.',['henssge','wetGarments','wetBlankets','wetLayers'],'Nelle fonti consultate non sono state individuate indicazioni specifiche per questa combinazione di indumenti e coperture. '+reason);
}
// Extend an already classified wet configuration; count its supporting base once.
function clothedSupportDelta(c){
  const thick=c.p>0||c.s>=3||c.m+c.h>0;
  if(c.surf<=1||c.surf===6)return 0;
  if(c.surf===2)return .10;
  if(c.surf===3)return thick?.10:.30;
  if([4,5,10].includes(c.surf))return thick?-.10:-.20;
  if(c.surf===8)return c.leaf==='wet'?0:c.leaf==='humid'?.10:c.leaf==='dry'?(thick?.10:.30):null;
  return null;
}
function supportAdjustmentNote(c,range,delta){
  return 'Dopo aver considerato gli indumenti, le coperture e le correnti d’aria, l’app applica '+(delta>=0?'+':'−')+fmt(Math.abs(delta))+' a entrambi gli estremi per la superficie di appoggio. La correzione segue la tabella di Henssge; l’associazione dei capi selezionati alla classe di isolamento è un ragionamento dell’app.';
}
function shiftedSupport(c,base){
  if(base.id==='feather-duvet'&&c.surf===2)return decision('feather-duvet-mattress',[base.range[0],base.range[1]+.1],'Ragionamento dell’app','Piumone di piume su materasso.',[...base.sources,'support'],'L’app mantiene il minimo del piumone di piume e aumenta il massimo di 0.10 per l’appoggio isolante. Questa combinazione non ha un intervallo specifico nelle fonti consultate.');
  const target=clothedSupportDelta(c);
  if(target===null)return pending('Precisare la superficie di appoggio.',['support']);
  const included=base.referenceSurface===2?.1:0,delta=target-included;
  if(!delta&&base.referenceSurface===undefined&&c.surf<=1)return base;
  let detail=supportAdjustmentNote(c,base.range,delta);
  if(c.surf===3)detail+=' Con più isolamento degli indumenti, la maggiorazione indicata nella tabella di Henssge scende da +0.30 a +0.10: il passaggio di categoria può ridurre il suggerimento.';
  if(c.surf===8)detail='L’app assimila le foglie '+(c.leaf==='humid'?'umide al materasso':c.leaf==='dry'?'secche a un supporto molto imbottito':'bagnate a un appoggio neutro')+' e applica '+(delta>=0?'+':'−')+fmt(Math.abs(delta))+' a entrambi gli estremi. Questa combinazione con indumenti o coperture non è stata verificata direttamente negli esperimenti sulle foglie.';
  if(included)detail=delta===0?'Il range di confronto comprende già il letto: l’app non aggiunge una seconda maggiorazione per l’appoggio. Gli estremi sono adattabili dall’operatore.':'Il caso della pratica medico-legale comprende già il letto. Per confrontarlo con l’appoggio selezionato, l’app sostituisce la maggiorazione del letto con quella del nuovo supporto, modificando entrambi gli estremi di '+(delta>0?'+':'−')+fmt(Math.abs(delta))+'.';
  let range=base.range.map(v=>Number((v+delta).toFixed(4)));
  if(delta<0){
    const naked=evaluateFixedAir({...c,s:0,p:0,m:0,h:0,wetCase:false});
    if(naked.range){
      const floor=naked.range[0];
      if(range.some(v=>v<floor-1e-8))detail+=' L’app non scende sotto il minimo previsto per il corpo nudo nelle stesse condizioni.';
      range=range.map(v=>Math.max(v,floor));
    }
  }
  return decision(base.id+'-support',range,'Ragionamento dell’app','Intervallo adattato alla superficie di appoggio.',[...base.sources,'support',...(c.surf===8?['leaves']:[]),...(c.surf===10?['pvc']:[])],detail);
}
function wetSupportDecision(c,base){
  if(!base.range)return base;
  const naked=c.s+c.p+c.m+c.h===0;
  if([2,3].includes(c.surf)){
    if(!['yes','no'].includes(c.supportSoaked))return pending('Precisare se l’appoggio è impregnato di liquidi.',['support','leaves']);
    if(c.supportSoaked==='yes')return decision(base.id+'-soaked',base.range,'Ragionamento dell’app','Appoggio impregnato: nessuna maggiorazione isolante.',[...base.sources,'leaves','soakedMattress'],'L’app non aggiunge l’effetto isolante delle imbottiture impregnate, per analogia con gli esperimenti sulle foglie bagnate. Questa assimilazione non è verificata per le imbottiture; il range è adattabile dall’operatore.');
  }
  if(!naked)return shiftedSupport(c,base);
  if([4,5,10].includes(c.surf))return decision('wet-naked-accelerating',[.6,.75],'Ragionamento dell’app','Corpo bagnato su superficie disperdente.',['wet','support','wetNakedAccelerating',...(c.surf===10?['pvc']:[])],'L’app propone un intervallo considerando il corpo nudo bagnato e l’effetto accelerante dell’appoggio. Il minimo 0.60 è una scelta dell’app, non un valore sperimentale per questa combinazione.');
  const range=c.surf===2?(c.wind?[.7,.95]:[.75,.95]):c.surf===3?(c.wind?[.7,1.05]:[.75,1.05]):null;
  if(!range)return pending('Combinazione da precisare.',['wet','support']);
  return decision('wet-naked-isolating',range,'Ragionamento dell’app','Corpo bagnato su superficie isolante.',['wet','support'],'Il minimo considera il corpo nudo bagnato nelle condizioni d’aria selezionate. Il massimo considera la possibile persistenza dell’isolamento dell’appoggio; questa combinazione non è quantificata direttamente nelle fonti.');
}
function blanketDecision(c){
  const n=c.m+c.h,clothed=c.s+c.p>0;
  if(c.state==='Bagnato')return wetBlanketDecision(c);
  if(c.h>0){
    if(!['no','yes'].includes(c.feather))return pending('Precisare il tipo di piumone.',['henssge','weight']);
    if(c.feather==='yes')return decision('feather-duvet',[2.8,3],'Ragionamento dell’app','Piumone di piume molto voluminoso e avvolgente.',['duvet'],'Intervallo proposto sulla base della categoria “piumone di piume” di Henssge. Adattabile dall’operatore in base all’isolamento effettivo.');
  }
  if(n>1){
    if(!['no','yes'].includes(c.volume))return pending('Precisare il volume delle coperture.',['henssge','casework']);
    if(c.volume==='yes'){
      const r=decision('blankets-voluminous',clothed?[2,2.8]:[1.8,2.8],'Ragionamento dell’app','Coperture sovrapposte molto voluminose.',['henssge','casework'],clothed?'L’app riprende il range del caso con due coperte molto spesse e indumenti, già comprensivo del letto. L’operatore può adattarlo al volume effettivo delle coperture.':'L’app considera il riferimento della coperta spessa e il caso della pratica medico-legale con coperture molto voluminose sul letto. L’estensione al corpo senza indumenti è un ragionamento dell’app.');
      // The whole-case analogy is evaluated on a bed; another support replaces its allowance.
      r.referenceSurface=2;return r;
    }
    return decision('blankets-ordinary',[1.8,2.4],'Ragionamento dell’app','Coperture sovrapposte.',['henssge'],'L’app propone un intervallo tenendo conto dei valori riportati nelle tabelle di Henssge per le coperture spesse e per l’associazione tra coperte e indumenti. Il numero delle coperture non determina incrementi fissi.');

function evaluateFixedAir(c){

function evaluateFC(c){
  if(!['Asciutto','Bagnato','Immerso'].includes(c.state))return pending('Specificare le condizioni in cui si è trovato il cadavere per ricevere suggerimenti basati sui dati di letteratura, oppure inserire direttamente il FC.');
  if(c.state==='Immerso')return evaluateFixedAir(c);
  if(!validCounts(c))return pending('Correggere i conteggi.');
  const air=c.air||(c.wind?'continuous':'still');
  if(air==='still'||air==='continuous')return evaluateFixedAir({...c,wind:air==='continuous'});
  if(!['intermittent','unknown'].includes(air))return pending('Precisare il movimento dell’aria.');
  const still=evaluateFixedAir({...c,wind:false}),moving=evaluateFixedAir({...c,wind:true});

// Formula transcribed from Henssge in Madea, 3rd ed., p.81, eq.6.10.
// Do not substitute Potente's 3.2 or the later transcription 3.24696.

function weightApplies(w){return w<60||w>80;}
function adjust(v,w){
  if(!Number.isFinite(v)||v<=0||!Number.isFinite(w)||w<4||w>150)return NaN;
  if(v<1.4||!weightApplies(w))return v;
  const denominator=(Math.pow(w,-.625)-.028)*(-3.24596*Math.exp(-.89959*v))-.0354;

function crossesWeightThreshold(a,b,w){return weightApplies(w)&&a<1.4&&b>=1.4;}
function bounds(a,b,w){
  if(!Number.isFinite(a)||!Number.isFinite(b)||a>b)return [NaN,NaN];
  const vals=[adjust(a,w),adjust(b,w)];
  // The interval is continuous. Include the left-hand limit at the discontinuity
  // as well as its adjusted value; checking only endpoints loses valid scenarios.
  if(crossesWeightThreshold(a,b,w))vals.push(1.4,adjust(1.4,w));
  return [Math.min(...vals),Math.max(...vals)];
}

    line('FC ricavato da uno studio sperimentale pubblicato, non direttamente riportato come tale nella tabella generale di Henssge.','yellow');
  }else{
    const ends=originalRanges[r.id];
    if(ends&&ends.length===2){
      line('Gli estremi '+ends.join(' e ')+' corrispondono a condizioni differenti previste nella tabella di Henssge.','green');
      line('In assenza di un riferimento specifico nelle tabelle di Henssge per la condizione indicata, l’app propone un intervallo compreso tra i valori previsti per condizioni differenti'+(examples.length?' e presenta alcuni esempi di casi pubblicati in letteratura e citati da Henssge':'')+'. L’intervallo può essere adattato dall’operatore.','red');
    }else if(ends&&ends.length===1){
      line('Il valore '+ends[0]+' è riportato nella tabella originale di Henssge.','green');
      line('L’estensione dell’intervallo alle condizioni selezionate è una deduzione dell’app.','red');
    }else{
      line('L’intervallo suggerito deriva da una valutazione per analogia dell’app e non è direttamente tabulato per questa combinazione.','red');
    }
  }
}

  q('#source-kind').textContent=showOrigin?originLabel(result)+':':'';
  q('#source-body').textContent='';q('#source-extra').textContent='';

  q('#rule-source').textContent=[result.detail,coverConvention(c),h08Notice].filter(Boolean).join(' ');

  const citations=q('#source-full-citations');citations.replaceChildren();
  const sourceIds=new Set(result.sources);
  if(state==='Immerso')sourceIds.add(c.water==='corrente'?'flowingWater':'waterExperiments');
  if(sourceIds.has('wetMixed')){sourceIds.add('henssge');sourceIds.add('wetGarments');}
  if(sourceIds.has('wetSupport'))sourceIds.add('support');
  for(const id of ['wetMixed','wetBlankets','wetSupport','wetNakedAccelerating','soakedMattress'])sourceIds.delete(id);
  for(const id of sourceIds)sourceDetails(citations,SOURCES[id]);
  if(state!=='Immerso'&&(c.thermalFoil||c.bodyBag))sourceDetails(citations,SOURCES.thermalCover);
  const seenExamples=new Set();
  for(const e of examples)if(!seenExamples.has(e.sourceText)){
    seenExamples.add(e.sourceText);
    sourceDetails(citations,{short:(SOURCES[e.source]?.short||'Fonte')+' · '+e.title,full:e.sourceText,url:e.url});
  }
  const w=num(q('#weight'));
  const active=result.range&&suggestion&&Number.isFinite(w)&&suggestion.some((v,i)=>v!==roundFC(result.range[i]));
  q('#weight-source').hidden=!active;
  q('#weight-source').textContent=active?'Il fattore di correzione è stato adattato al peso (FC per 70 kg = '+rangeText(result.range)+', per il peso di '+String(Number(w.toFixed(2)))+' kg = '+rangeText(suggestion)+').':'';
  if(active&&!result.sources.includes('weight'))sourceDetails(citations,SOURCES.weight);
  const list=q('#example-list');list.replaceChildren();q('#source-examples').hidden=examples.length===0;
  for(const e of examples){
    const item=document.createElement('div');item.className='source-example';
    paragraph(item,(e.type==='Caso operativo'?'Caso della pratica medico-legale':e.type==='Simulatore'?'Prova su simulatore':'Esperimento su cadavere')+' · '+e.title);
    const prefix=exampleWeightRelevant(e)?(e.type==='Simulatore'?'Peso virtuale standard: ':'Peso: ')+(e.weights||[e.virtualWeight??e.weight]).map(String).join(' / ')+' kg · ':'';
    paragraph(item,prefix+exampleConditions(e)+' '+exampleDecimalText(exampleFCText(e)));
    if(e.notes&&e.title!=='Caso 33')paragraph(item,exampleDecimalText(e.notes));
    list.append(item);
  }
}
function manualSelectionNote(a,b){
  const prefix='FC compilato manualmente';
  if(!Number.isFinite(a)||!Number.isFinite(b)||a<.35||b<a)return prefix+'.';
  if(!suggestion)return prefix+', senza un suggerimento automatico disponibile per le condizioni indicate.';
  const [lo,hi]=suggestion,reference=rangeText(suggestion);
  if(a===lo&&b===hi)return '';
  if(lo===hi){
    return prefix+', diverso dal valore suggerito dall’app ('+reference+').';
  }
  if(a>=lo&&b<=hi)return prefix+', entro l’intervallo suggerito dall’app ('+reference+').';
  const overlap=b>=lo&&a<=hi;
  return prefix+(overlap?', in parte al di fuori':', al di fuori')+' dell’intervallo suggerito dall’app ('+reference+').';
}
function update(){
  const c=data(),a=num(q('#lo')),b=num(q('#hi')),w=num(q('#weight'));
  let error='';
  if(state!=='Immerso'&&!validCounts(c))error='Inserire conteggi interi da 0 a 20.';
  else if(!Number.isFinite(a)||!Number.isFinite(b))error=result.range&&suggestion?(rangeExpanded?'Inserire entrambi gli estremi.':'Inserire il FC o selezionare le condizioni del corpo.'):result.summary;
  else if(a<.35||b<a)error='Minimo ≥ 0.35 e massimo ≥ minimo.';
  else if(!onFCGrid(a)||!onFCGrid(b))error='Passi di 0.05: arrotondamento all’uscita dal campo.';
  else if(q('#weight').value.trim()!==''&&(!Number.isFinite(w)||w<4||w>150))error='Inserire un peso tra 4 e 150 kg.';
  q('#error').textContent=error;
  q('#use').disabled=!!error;
  
  const reference=manual?manualBase:(selectedBase||result.range);
  const adapted=Number.isFinite(w)&&Array.isArray(reference)&&reference.length===2
    &&reference.every(Number.isFinite)&&[a,b].every(Number.isFinite)
    &&[a,b].some((v,i)=>v!==roundFC(reference[i]));
  const missingWeight=q('#weight').value.trim()===''&&Array.isArray(reference)&&reference.some(v=>v>=1.4);
  const weightNote=adapted?'FC adattato per il peso ('+String(Number(w.toFixed(2)))+' kg).':missingWeight?'FC previsto per un cadavere del peso di circa 70 kg. Se verrà inserito un peso diverso nella pagina principale, il FC o il suo range verranno adattati di conseguenza.':'';
  q('#manual-state').textContent=weightNote&&manual?weightNote+' Se desideri valori diversi, reinseriscili manualmente.':weightNote;
  q('#editable-note').hidden=!manual&&!preset;
  q('#editable-note').textContent=manual?manualSelectionNote(a,b):preset?'FC preimpostato, non ancora modificato.':'';
  q('#origin').textContent=result.range&&suggestion?'':result.summary;
  q('#restore').disabled=!suggestion&&!manual;
  root.querySelectorAll('[data-input]').forEach(btn=>{
    const el=q('#'+btn.dataset.input),v=num(el)+Number(btn.dataset.step);
    if(['lo','hi'].includes(el.id))btn.disabled=!Number.isFinite(v)||v<.35||(rangeExpanded&&el.id==='lo'&&Number.isFinite(b)&&v>b)||(el.id==='hi'&&Number.isFinite(a)&&v<a);
    else btn.disabled=!Number.isInteger(v)||v<0||v>20;
  });
  const expanded=rangeExpanded||(Number.isFinite(a)&&Number.isFinite(b)&&a!==b);
  const hasNote=!!(q('#editable-note').textContent||q('#manual-state').textContent);
  q('#fc-selection-note').hidden=!hasNote;
  q('#lo-note-marker').hidden=!hasNote||expanded;
  q('#hi-note-marker').hidden=!hasNote||!expanded;
  q('#choice-row').dataset.range=String(expanded);
  q('#hi-control').hidden=!expanded;
  q('#expand-range').textContent=expanded?'Valore singolo?':'Range?';
  q('#expand-range').setAttribute('aria-label',expanded?'Usa un solo FC, mantenendo il minimo':'Crea range FC');
  q('#expand-range').setAttribute('aria-expanded',String(expanded));
  q('#lo').setAttribute('aria-label',expanded?'FC minimo':'FC');
  showSource();
  window.FCScenarios?.refresh();
}
function airChangesSuggestion(c){
  if(c.state==='Immerso')return false;
  // Two undefined scenarios do not establish equivalence.
  if(!validCounts(c))return true;
  const still=evaluateFixedAir({...c,air:'still',wind:false});
  const moving=evaluateFixedAir({...c,air:'continuous',wind:true});
  return !still.range||!moving.range||still.range.some((v,i)=>Math.abs(v-moving.range[i])>1e-8);
}
function recalc(){
  let c=data();
  const showAir=airChangesSuggestion({...c,state});
  q('#air-row').hidden=!showAir;
  if(!showAir&&q('#air-help').matches(':popover-open'))q('#air-help').hidePopover();
  // Preserve the operator's air selection while the control is irrelevant.
  if(!showAir)c={...c,air:'still',wind:false};
  q('#air-fields').hidden=state==='Immerso';
  q('#water-fields').hidden=state!=='Immerso';
  q('#metal-type-row').hidden=state==='Immerso'||q('#surface').value!=='metal';
  q('#isolation-row').hidden=state!=='Asciutto'||c.m+c.h>0||!isMany(c);
  q('#blanket-volume-row').hidden=state!=='Asciutto'||c.m+c.h<=1||(c.h>0&&c.feather!=='no');
  q('#feather-row').hidden=state!=='Asciutto'||c.h===0;
  q('#leaf-row').hidden=state==='Immerso'||c.surf!==8;
  q('#leaf-cover-row').hidden=state==='Immerso'||c.surf!==8;
  q('#support-soaked-row').hidden=state!=='Bagnato'||![2,3].includes(c.surf);
  for(const [id,row] of [['isolation','isolation-row'],['feather','feather-row'],['blanket-volume','blanket-volume-row'],['leaf','leaf-row'],['leaf-cover','leaf-cover-row'],['metal-type','metal-type-row'],['support-soaked','support-soaked-row']]){
    const el=q('#'+id),required=state!=='Immerso'&&!q('#'+row).hidden,missing=required&&(el.value===''||el.value==='unknown');
    el.setAttribute('data-needs-value',String(missing));
    el.setAttribute('aria-invalid',String(missing));
    el.setAttribute('aria-required',String(required));
  }
  q('#wet-case-row').hidden=state!=='Bagnato'||c.air!=='continuous'||c.surf!==1||c.m+c.h>0||c.s+c.p!==2;
  result=evaluateFC({...c,state,water:q('#water').value,isolation:q('#isolation').value});
  const w=num(q('#weight'));
  lastWeight=w;
  const validWeight=Number.isFinite(w)&&w>=4&&w<=150;
  const adapted=result.range?(validWeight?bounds(...result.range,w):result.range):null;
  suggestion=adapted&&adapted.every(Number.isFinite)?roundRange(adapted):null;
  if(result.range&&!suggestion&&Number.isFinite(w)&&w>=4&&w<=150)result={...result,summary:'Adattamento al peso non calcolabile: verificare i valori.',detail:result.detail+' Il calcolo non restituisce valori validi.'};
  manual=false;preset=false;manualBase=null;manualWeightAdjusted=false;selectedBase=null;weightAdjusted=false;
  q('#lo').value=suggestion?fmt(suggestion[0]):'';
  q('#hi').value=suggestion?fmt(suggestion[1]):'';
  rangeExpanded=!!suggestion&&suggestion[0]!==suggestion[1];
  update();
}
function recordManualEdit(id){
  if(id==='lo'&&!rangeExpanded)q('#hi').value=q('#lo').value;
  manual=true;preset=false;manualWeightAdjusted=false;selectedBase=null;weightAdjusted=false;
  const values=[num(q('#lo')),num(q('#hi'))];
  manualBase=values.every(Number.isFinite)&&values[0]>=.35&&values[1]>=values[0]?roundRange(values):null;
  update();
}
function adaptSelectedToWeight(){
  const w=num(q('#weight'));
  const base=manual?manualBase:selectedBase;
  if(!base||!base.every(Number.isFinite)||!Number.isFinite(w)||w<4||w>150)return;
  const adapted=bounds(...base,w);
  if(!adapted.every(Number.isFinite))return;
  const values=roundRange(adapted),previous=[num(q('#lo')),num(q('#hi'))];
  weightAdjusted=values.some((v,i)=>v!==previous[i]);
  manualWeightAdjusted=manual&&weightAdjusted;
  q('#lo').value=fmt(values[0]);q('#hi').value=fmt(values[1]);
}
function onWeightChange(){
  if(num(q('#weight'))===lastWeight)return;
  if(window.FCScenarios?.weightChanged())return;
  const saved=window.FCPanel.snapshot();
  applied=null;recalc();
  if(saved.manual||saved.selectedBase||(saved.lo===''&&saved.hi==='')){
    manual=saved.manual;preset=!!saved.preset;manualBase=saved.manualBase;manualWeightAdjusted=saved.manualWeightAdjusted;selectedBase=saved.selectedBase;
    q('#lo').value=saved.lo;q('#hi').value=saved.hi;
    adaptSelectedToWeight();rangeExpanded=!!saved.rangeExpanded||(Number.isFinite(num(q('#lo')))&&Number.isFinite(num(q('#hi')))&&num(q('#lo'))!==num(q('#hi')));update();
  }
  const previous=[Number(saved.lo),Number(saved.hi)],current=[num(q('#lo')),num(q('#hi'))];
  weightAdjusted=saved.lo!==''&&saved.hi!==''&&previous.every(Number.isFinite)&&current.every(Number.isFinite)&&current.some((v,i)=>v!==previous[i]);
  update();
}
root.addEventListener('keydown',e=>{if(e.key==='Escape')q('#source-panel').open=false;});
root.querySelectorAll('[data-state]').forEach(btn=>btn.addEventListener('click',()=>{state=btn.dataset.state;root.querySelectorAll('[data-state]').forEach(b=>b.setAttribute('aria-pressed',String(b===btn)));recalc();}));root.querySelectorAll('[data-input]').forEach(btn=>btn.addEventListener('click',()=>{const el=q('#'+btn.dataset.input),v=num(el)+Number(btn.dataset.step);el.value=['lo','hi'].includes(el.id)?fmt(roundFC(v)):String(v);if(['lo','hi'].includes(el.id)){recordManualEdit(el.id);}else {counters.changed(el.id);recalc();}}));specs.forEach(([id])=>q('#'+id).addEventListener('input',()=>{counters.changed(id);recalc();}));['surface','metal-type','leaf','leaf-cover','feather','air','water','isolation','blanket-volume','support-soaked','wet-case','thermal-foil','body-bag'].forEach(id=>q('#'+id).addEventListener('change',recalc));['lo','hi'].forEach(id=>q('#'+id).addEventListener('input',()=>{recordManualEdit(id);}));q('#weight').addEventListener('input',onWeightChange);root.querySelectorAll('[data-weight]').forEach(btn=>btn.addEventListener('click',()=>{const v=num(q('#weight'))+Number(btn.dataset.weight);if(Number.isFinite(v)&&v>=4&&v<=150)setWeight(v);onWeightChange();}));root.querySelectorAll('input').forEach(el=>el.addEventListener('blur',()=>{const v=num(el);if(Number.isFinite(v))el.value=el.id==='weight'?v.toFixed(0):['lo','hi'].includes(el.id)?fmt(roundFC(v)):String(v);if(el.id==='weight'){setWeight(v);onWeightChange();}if(['lo','hi'].includes(el.id)){if(el.id==='lo'&&!rangeExpanded)q('#hi').value=el.value;update();}}));q('#restore').addEventListener('click',()=>{q('#lo').value=suggestion?fmt(suggestion[0]):'';q('#hi').value=suggestion?fmt(suggestion[1]):'';manual=false;preset=false;manualBase=null;manualWeightAdjusted=false;selectedBase=null;weightAdjusted=false;rangeExpanded=!!suggestion&&suggestion[0]!==suggestion[1];update();});q('#back').addEventListener('click',()=>window.FCBridge.send('back'));

const savedFields=['teli','light-cover','thin','thick','medium','heavy','surface','metal-type','leaf','leaf-cover','feather','air','water','isolation','blanket-volume','support-soaked'];
window.FCPanel={
