<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    background: transparent;
    overflow: visible;
    font-family: Arial, sans-serif;
  }
  #livor-choice {
    box-sizing: border-box;
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 34px;
    padding: 4px 6px;
    border: 1px solid var(--line, #dde3e5);
    border-radius: 6px;
    background: var(--bg, #ffffff);
    color: var(--ink, #263238);
    font: 400 13px/1.35 Arial, sans-serif;
    /* Il menu nativo del browser si sovrappone alla pagina, senza aumentare
       l'altezza del componente o inserire pulsanti radio in un popover. */
    appearance: auto;
  }
  #livor-choice option {
    background: var(--bg, #ffffff);
    color: var(--ink, #263238);
    font: inherit;
  }
  #livor-choice:focus-visible {
    outline: 2px solid var(--primary, #087fa0);
    outline-offset: -2px;
  }
  @media (pointer: coarse) {
    #livor-choice {
      min-height: 44px;
      font-size: 16px;
    }
  }
</style>
</head>
<body>
  <select id="livor-choice" aria-label="Macchie ipostatiche"></select>
<script>
(() => {
  "use strict";
  const select = document.getElementById("livor-choice");
  let optionsSignature = "";

  function send(type, data) {
    window.parent.postMessage(Object.assign({
      isStreamlitMessage: true,
      type
    }, data || {}), "*");
  }

  function render(args) {
    const choices = Array.isArray(args.options)
      ? args.options.filter(value => typeof value === "string")
      : [];
    const signature = JSON.stringify(choices);
    if (signature !== optionsSignature) {
      select.replaceChildren(...choices.map(value => new Option(value, value)));
      optionsSignature = signature;
    }
    const chosen = choices.includes(args.value) ? args.value : (choices[0] || "");
    if (select.value !== chosen) select.value = chosen;

    const dark = args.dark === true;
    document.documentElement.style.setProperty("--bg", dark ? "#15191f" : "#ffffff");
    document.documentElement.style.setProperty("--ink", dark ? "#edf1f3" : "#263238");
    document.documentElement.style.setProperty("--line", dark ? "#3b454f" : "#dde3e5");
    select.disabled = choices.length === 0;
    send("streamlit:setFrameHeight", {
      height: window.matchMedia("(pointer: coarse)").matches ? 46 : 36
    });
  }

  window.addEventListener("message", event => {
    if (event.source !== window.parent) return;
    if (!event.data || event.data.type !== "streamlit:render") return;
    render(event.data.args || {});
  });

  select.addEventListener("change", () => {
    send("streamlit:setComponentValue", {value: select.value});
  });

  send("streamlit:componentReady", {apiVersion: 1});
})();
</script>
</body>
</html>
