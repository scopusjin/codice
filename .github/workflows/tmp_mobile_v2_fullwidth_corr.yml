name: Temporary mobile V2 fullwidth and corr right

on:
  push:
    branches:
      - tmp-mobile-v2-fullwidth-corr-right-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mobile-v2-fullwidth-corr-right-v2
          fetch-depth: 0

      - name: Apply structural mobile layout patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          stima_path = Path('Stima_epoca_decesso.py')
          stima = stima_path.read_text(encoding='utf-8')

          start_marker = '''        else:
              # -------------------------
              # 🔷 MASCHERA STANDARD
              # -------------------------
          '''
          start_marker = start_marker.replace('              ', '            ')
          start = stima.index(start_marker)
          end = stima.index('\n    # --- Pannello "Suggerisci FC" interno al riquadro raffreddamento ---', start)
          old_standard = stima[start:end]
          assert old_standard.count('st.columns([1, 1, 1], gap="small")') == 2
          assert old_standard.count('key="fattore_correzione"') == 1

          new_standard = '''        else:
              # -------------------------
              # 🔷 MASCHERA STANDARD
              # -------------------------
              if full_mobile:
                  # Su mobile i V2 sono renderizzati direttamente nella pila:
                  # nessun vecchio st.columns limita la larghezza disponibile.
                  with st.container(gap="xsmall", key="cooling_standard_v2_stack_mobile"):
                      rectal_label = i18n.ui_text("full.rectal_temp_label")
                      st.number_input(
                          rectal_label,
                          value=sget("rt_val", 35.0), step=0.1, format="%.1f",
                          key="rt_val", label_visibility="collapsed"
                      )
                      st.number_input(
                          i18n.ui_text("full.antemortem_temp_estimated_label"),
                          value=sget("tm_val", 37.2), step=0.1, format="%.1f",
                          key="tm_val", label_visibility="collapsed"
                      )
                      st.number_input(
                          i18n.ui_text("full.weight_label"),
                          value=sget("peso", 70.0), step=1.0, format="%.1f",
                          key="peso", label_visibility="collapsed"
                      )
                      st.number_input(
                          i18n.ui_text("full.ta_input_label"),
                          value=sget("ta_base_val", 20.0), step=0.1, format="%.1f",
                          key="ta_base_val", label_visibility="collapsed"
                      )
                      st.number_input(
                          i18n.ui_text("full.fc_input_label"),
                          value=sget("fattore_correzione", 1.0), step=0.1, format="%.2f",
                          key="fattore_correzione", label_visibility="collapsed"
                      )
                      # Resta montato per conservare lo stesso stato; il CSS mobile
                      # lo nasconde perché il comando Consiglia è integrato nel V2.
                      st.toggle(i18n.ui_text("full.suggest_fc"), key="toggle_fattore_inline_std")
                      st.session_state["toggle_fattore"] = st.session_state.get("toggle_fattore_inline_std", False)
              else:
                  col1, col2, col3 = st.columns([1, 1, 1], gap="small")
                  with col1:
                      rectal_label = i18n.ui_text("full.rectal_temp_label")
                      st.markdown(f"<div style='font-size: 0.88rem;'>{rectal_label}</div>", unsafe_allow_html=True)
                      st.number_input(rectal_label,
                                      value=sget("rt_val", 35.0), step=0.1, format="%.1f",
                                      key="rt_val", label_visibility="collapsed")
                  with col2:
                      antemortem_label = i18n.ui_text("full.antemortem_temp_label")
                      st.markdown(f"<div style='font-size: 0.88rem;'>{antemortem_label}</div>", unsafe_allow_html=True)
                      st.number_input(i18n.ui_text("full.antemortem_temp_estimated_label"),
                                      value=sget("tm_val", 37.2), step=0.1, format="%.1f",
                                      key="tm_val", label_visibility="collapsed")
                  with col3:
                      weight_label_standard = i18n.ui_text("full.weight_label_standard")
                      st.markdown(f"<div style='font-size: 0.88rem;'>{weight_label_standard}</div>", unsafe_allow_html=True)
                      st.number_input(i18n.ui_text("full.weight_label"),
                                      value=sget("peso", 70.0), step=1.0, format="%.1f",
                                      key="peso", label_visibility="collapsed")

                  col1, col2, col3 = st.columns([1, 1, 1], gap="small")
                  with col1:
                      ta_label = i18n.ui_text("full.ta_mean_label")
                      st.markdown(f"<div style='font-size: 0.88rem;'>{ta_label}</div>", unsafe_allow_html=True)
                      st.number_input(i18n.ui_text("full.ta_input_label"),
                                      value=sget("ta_base_val", 20.0), step=0.1, format="%.1f",
                                      key="ta_base_val", label_visibility="collapsed")

                  with col2:
                      fc_label = i18n.ui_text("full.fc_label")
                      st.markdown(f"<div style='font-size: 0.88rem;'>{fc_label}</div>", unsafe_allow_html=True)
                      st.number_input(i18n.ui_text("full.fc_input_label"),
                                      value=sget("fattore_correzione", 1.0), step=0.1, format="%.2f",
                                      key="fattore_correzione", label_visibility="collapsed")
                  with col3:
                      st.toggle(i18n.ui_text("full.suggest_fc"), key="toggle_fattore_inline_std")
                      st.session_state["toggle_fattore"] = st.session_state.get("toggle_fattore_inline_std", False)
          '''
          new_standard = new_standard.replace('              ', '            ', 1)
          # Il blocco sopra è scritto con indentazione Python esplicita: normalizza
          # soltanto la prima riga, poi usa il testo così com'è.
          lines = new_standard.splitlines(True)
          lines[0] = '        else:\n'
          new_standard = ''.join(lines)
          stima = stima[:start] + new_standard + stima[end:]
          stima_path.write_text(stima, encoding='utf-8')

          panel_path = Path('app/full_factor_panel.py')
          panel = panel_path.read_text(encoding='utf-8')
          switch_start_marker = (
              '        with st.container(\n'
              '            horizontal=True,\n'
              '            wrap=False,\n'
              '            gap="xsmall",\n'
              '            key=k("switch_row"),\n'
              '        ):\n'
          )
          switch_start = panel.index(switch_start_marker)
          switch_end = panel.index('    elif mobile:\n', switch_start)
          old_switch = panel[switch_start:switch_end]
          assert old_switch.count('key=k("vest_slot")') == 1
          assert old_switch.count('key=k("vest_help_slot")') == 1
          assert old_switch.count('key=k("corr_slot")') == 1

          new_switch = '''        with st.container(
              horizontal=True,
              wrap=False,
              horizontal_alignment="distribute",
              vertical_alignment="center",
              gap="small",
              key=k("switch_row"),
          ):
              with st.container(
                  horizontal=True,
                  wrap=False,
                  vertical_alignment="center",
                  gap="xsmall",
                  width="content",
                  key=k("vest_group"),
              ):
                  with st.container(width="content", key=k("vest_slot")):
                      toggle_vestito = st.toggle(
                          "Vestiti/coperte",
                          key=k("toggle_vestito"), value=False
                      )
                  with st.container(width="content", key=k("vest_help_slot")):
                      with st.popover("?"):
                          st.markdown(
                              """
                              <div class="mortem-help-copy">
                                <div class="mortem-help-copy-intro">Esempi orientativi per classificare vestiti, teli e coperte:</div>
                                <div class="mortem-help-copy-bullet">• Vestiti/teli leggeri: T-shirt, camicia, lenzuolo o telo sottile.</div>
                                <div class="mortem-help-copy-bullet">• Vestiti/teli pesanti: maglione, felpa pesante, giacca o telo spesso.</div>
                                <div class="mortem-help-copy-bullet">• Coperte medie: coperta di normale spessore.</div>
                                <div class="mortem-help-copy-bullet">• Coperte pesanti/termiche: piumone pesante o mantellina/coperta termica.</div>
                                <div class="mortem-help-copy-intro">Conta separatamente ogni strato effettivamente presente sul corpo.</div>
                              </div>
                              """,
                              unsafe_allow_html=True,
                          )
              with st.container(width="content", key=k("corr_slot")):
                  corr_placeholder = st.empty()
          '''
          panel = panel[:switch_start] + new_switch + panel[switch_end:]
          panel_path.write_text(panel, encoding='utf-8')
          PY

      - name: Check diff and syntax
        shell: bash
        run: |
          git diff --check
          python -m compileall -q Stima_epoca_decesso.py app/full_factor_panel.py
          python - <<'PY'
          from pathlib import Path
          stima = Path('Stima_epoca_decesso.py').read_text(encoding='utf-8')
          panel = Path('app/full_factor_panel.py').read_text(encoding='utf-8')
          assert 'key="cooling_standard_v2_stack_mobile"' in stima
          assert stima.count('key="rt_val"') >= 2
          assert 'horizontal_alignment="distribute"' in panel
          assert 'key=k("vest_group")' in panel
          assert panel.index('key=k("vest_group")') < panel.index('key=k("corr_slot")')
          PY
          git diff -- Stima_epoca_decesso.py app/full_factor_panel.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Stima_epoca_decesso.py app/full_factor_panel.py
          git commit -m "Allarga V2 e allinea correnti mobile"
          git push origin HEAD:tmp-mobile-v2-fullwidth-corr-right-v2
