name: Temporary Word copy format

on:
  push:
    branches:
      - tmp-word-copy-format

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-word-copy-format
      - name: Apply detailed descriptions formatting
        shell: python
        run: |
          from pathlib import Path
          path = Path("app/graphing.py")
          text = path.read_text(encoding="utf-8")
          old = '''def _wrap_final(s: str | None) -> str | None:
              return f'<div class="final-text">{s}</div>' if s else s
          '''
          new = '''def _wrap_final(s: str | None) -> str | None:
              return (
                  f'<div class="final-text" style="font-family:Arial,sans-serif;font-size:10pt;line-height:14pt;mso-line-height-rule:at-least;">{s}</div>'
                  if s else s
              )
          '''
          if old not in text:
              raise SystemExit("Target _wrap_final block not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Check syntax and diff
        run: |
          python -m py_compile app/graphing.py
          git diff --check
          git diff -- app/graphing.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/graphing.py
          git commit -m "Formatta descrizioni dettagliate per Word"
          git push origin HEAD:tmp-word-copy-format
