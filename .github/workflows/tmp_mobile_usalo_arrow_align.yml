name: Temporary mobile Usalo arrow align

on:
  push:
    branches:
      - tmp-mobile-usalo-arrow-align

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mobile-usalo-arrow-align
          fetch-depth: 0

      - name: Apply exact UI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          panel_path = Path('app/full_factor_panel.py')
          panel = panel_path.read_text(encoding='utf-8')
          old = '                        "Usalo",\n'
          new = '                        "→ Usalo",\n'
          assert panel.count(old) == 1
          panel = panel.replace(old, new, 1)
          panel_path.write_text(panel, encoding='utf-8')

          css_path = Path('app/full_mobile_compact.py')
          css = css_path.read_text(encoding='utf-8')

          row_marker = '[class*="fc_apply_row_mobile"] {'
          row_pos = css.index(row_marker)
          row_old = '''  height: 2.15rem !important;\n  min-height: 2.15rem !important;\n  max-height: 2.15rem !important;\n'''
          row_hit = css.index(row_old, row_pos)
          css = css[:row_hit] + '''  height: 1.90rem !important;\n  min-height: 1.90rem !important;\n  max-height: 1.90rem !important;\n''' + css[row_hit + len(row_old):]

          result_marker = '.mortem-fc-inline-result {'
          result_pos = css.index(result_marker)
          result_old = '''  height: 2.15rem;\n  min-height: 2.15rem;\n  max-height: 2.15rem;\n'''
          result_hit = css.index(result_old, result_pos)
          css = css[:result_hit] + '''  height: 1.90rem;\n  min-height: 1.90rem;\n  max-height: 1.90rem;\n''' + css[result_hit + len(result_old):]

          button_marker = '[class*="fc_apply_action_mobile"] button {'
          button_pos = css.index(button_marker)
          button_old = '''  height: 1.86rem !important;\n  min-height: 1.86rem !important;\n  max-height: 1.86rem !important;\n'''
          button_hit = css.index(button_old, button_pos)
          css = css[:button_hit] + '''  height: 1.90rem !important;\n  min-height: 1.90rem !important;\n  max-height: 1.90rem !important;\n''' + css[button_hit + len(button_old):]

          wrappers_marker = '[class*="fc_apply_action_mobile"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="fc_apply_action_mobile"] > [data-testid="stVerticalBlock"]'
          wrappers_pos = css.index(wrappers_marker)
          wrappers_old = '''  height: 2.15rem !important;\n  min-height: 2.15rem !important;\n  max-height: 2.15rem !important;\n'''
          wrappers_hit = css.index(wrappers_old, wrappers_pos)
          css = css[:wrappers_hit] + '''  height: 1.90rem !important;\n  min-height: 1.90rem !important;\n  max-height: 1.90rem !important;\n''' + css[wrappers_hit + len(wrappers_old):]

          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Check diff and syntax
        shell: bash
        run: |
          git diff --check
          python -m compileall -q app/full_factor_panel.py app/full_mobile_compact.py
          python - <<'PY'
          from pathlib import Path
          panel = Path('app/full_factor_panel.py').read_text(encoding='utf-8')
          css = Path('app/full_mobile_compact.py').read_text(encoding='utf-8')
          assert '"→ Usalo"' in panel
          assert css.count('height: 1.90rem') >= 2
          assert css.count('height: 1.90rem !important;') >= 3
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/full_factor_panel.py app/full_mobile_compact.py
          git diff --cached --quiet && exit 0
          git commit -m "Allinea pulsante Usalo mobile"
          git push origin HEAD:tmp-mobile-usalo-arrow-align
