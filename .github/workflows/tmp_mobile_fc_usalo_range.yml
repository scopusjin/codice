name: Temporary mobile FC usalo range

on:
  push:
    branches:
      - tmp-mobile-fc-usalo-range

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mobile-fc-usalo-range
          fetch-depth: 0

      - name: Apply exact patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          panel_path = Path('app/full_factor_panel.py')
          panel = panel_path.read_text(encoding='utf-8')

          old_apply = '''    def _apply_fc(val: float, riass: str | None) -> None:\n        st.session_state["fattore_correzione"] = round(float(val), 2)\n        st.session_state["fattori_condizioni_parentetica"] = None\n        st.session_state["fattori_condizioni_testo"] = None\n        st.session_state["toggle_fattore"] = False\n        st.session_state["fc_riassunto_contatori"] = riass\n\n'''
          new_apply = old_apply + '''    def _apply_fc_range(val: float) -> None:\n        add_fc_suggestion_global(val)\n        st.session_state["toggle_fattore_inline"] = False\n        st.session_state["toggle_fattore"] = False\n        st.session_state.pop("__full_fc_suggest_target", None)\n\n'''
          assert panel.count(old_apply) == 1
          panel = panel.replace(old_apply, new_apply, 1)

          old_mobile = '    if full_mobile and not range_mode:\n'
          assert panel.count(old_mobile) == 1
          panel = panel.replace(old_mobile, '    if full_mobile:\n', 1)

          old_side = '''        with st.container(border=False, key=f"{key_prefix}_fc_apply_block_mobile"):\n            with st.container(\n                horizontal=True,\n                wrap=False,\n                horizontal_alignment="distribute",\n                vertical_alignment="center",\n                gap=None,\n                key=f"{key_prefix}_fc_apply_row_mobile",\n            ):\n                with st.container(width="stretch", key=f"{key_prefix}_fc_apply_value_mobile"):\n                    st.markdown(\n                        f'<div class="mortem-fc-inline-result">FC suggerito:&nbsp;<strong>{result.fattore_finale:.2f}</strong></div>',\n                        unsafe_allow_html=True,\n                    )\n                with st.container(width="content", key=f"{key_prefix}_fc_apply_action_mobile"):\n                    st.button(\n                        "→ Usa",\n                        type="secondary",\n                        on_click=_apply_fc, args=(result.fattore_finale, result.riassunto),\n                        key=f"{key_prefix}_btn_usa_fc{suffix}",\n                    )\n'''
          new_side = '''        apply_callback = _apply_fc_range if range_mode else _apply_fc\n        apply_args = (result.fattore_finale,) if range_mode else (result.fattore_finale, result.riassunto)\n\n        with st.container(border=False, key=f"{key_prefix}_fc_apply_block_mobile"):\n            with st.container(\n                horizontal=True,\n                wrap=False,\n                horizontal_alignment="left",\n                vertical_alignment="center",\n                gap="small",\n                key=f"{key_prefix}_fc_apply_row_mobile",\n            ):\n                with st.container(width="content", key=f"{key_prefix}_fc_apply_value_mobile"):\n                    st.markdown(\n                        f'<div class="mortem-fc-inline-result">FC suggerito:&nbsp;<strong>{result.fattore_finale:.2f}</strong></div>',\n                        unsafe_allow_html=True,\n                    )\n                with st.container(width="content", key=f"{key_prefix}_fc_apply_action_mobile"):\n                    st.button(\n                        "Usalo",\n                        type="secondary",\n                        on_click=apply_callback, args=apply_args,\n                        key=f"{key_prefix}_btn_usa_fc{suffix}",\n                    )\n'''
          assert panel.count(old_side) == 1
          panel = panel.replace(old_side, new_side, 1)

          old_add = '''    if st.session_state.get("stima_cautelativa_beta", False):\n        st.button(\n            i18n.ui_text("full.add_to_fc_range"),\n            use_container_width=True, on_click=add_fc_suggestion_global,\n            args=(result.fattore_finale,), key=f"{key_prefix}_btn_add_fc{suffix}"\n        )\n'''
          new_add = '''    if st.session_state.get("stima_cautelativa_beta", False) and not full_mobile:\n        st.button(\n            i18n.ui_text("full.add_to_fc_range"),\n            use_container_width=True, on_click=add_fc_suggestion_global,\n            args=(result.fattore_finale,), key=f"{key_prefix}_btn_add_fc{suffix}"\n        )\n'''
          assert panel.count(old_add) == 1
          panel = panel.replace(old_add, new_add, 1)
          panel_path.write_text(panel, encoding='utf-8')

          css_path = Path('app/full_mobile_compact.py')
          css = css_path.read_text(encoding='utf-8')

          css = css.replace('  gap: 0 !important;\n  align-items: center !important;\n  overflow: hidden !important;\n', '  gap: 0.34rem !important;\n  align-items: center !important;\n  justify-content: flex-start !important;\n  overflow: hidden !important;\n', 1)

          old_value = '''[class*="fc_apply_value_mobile"] {\n  flex: 1 1 auto !important;\n  min-width: 0 !important;\n  margin: 0 !important;\n  padding: 0 !important;\n}\n'''
          new_value = '''[class*="fc_apply_value_mobile"] {\n  flex: 0 0 auto !important;\n  width: max-content !important;\n  min-width: max-content !important;\n  margin: 0 !important;\n  padding: 0 !important;\n}\n'''
          assert css.count(old_value) == 1
          css = css.replace(old_value, new_value, 1)

          old_button = '''[class*="fc_apply_action_mobile"] button {\n  height: 1.86rem !important;\n  min-height: 1.86rem !important;\n  max-height: 1.86rem !important;\n  margin: 0 0.12rem 0 0 !important;\n  padding: 0 0.58rem !important;\n  border: 1px solid var(--st-primary-color) !important;\n  border-radius: 0.44rem !important;\n  background: color-mix(in srgb, var(--st-primary-color) 13%, var(--st-secondary-background-color)) !important;\n  color: var(--st-text-color) !important;\n  font-weight: 650 !important;\n  white-space: nowrap !important;\n}\n'''
          new_button = '''[class*="fc_apply_action_mobile"] button {\n  height: 1.86rem !important;\n  min-height: 1.86rem !important;\n  max-height: 1.86rem !important;\n  margin: 0 !important;\n  padding: 0 0.62rem !important;\n  border: 1.5px solid var(--st-primary-color) !important;\n  border-radius: 0.44rem !important;\n  background: var(--st-secondary-background-color) !important;\n  color: var(--st-primary-color) !important;\n  box-shadow: 0 0 0 1px color-mix(in srgb, var(--st-primary-color) 14%, transparent) !important;\n  font-weight: 700 !important;\n  white-space: nowrap !important;\n}\n'''
          assert css.count(old_button) == 1
          css = css.replace(old_button, new_button, 1)

          old_button_text = '''[class*="fc_apply_action_mobile"] button span {\n  color: var(--st-text-color) !important;\n  font-weight: 650 !important;\n}\n'''
          new_button_text = '''[class*="fc_apply_action_mobile"] button span {\n  color: var(--st-primary-color) !important;\n  font-weight: 700 !important;\n}\n'''
          assert css.count(old_button_text) == 1
          css = css.replace(old_button_text, new_button_text, 1)

          old_justify = '  justify-content: flex-end !important;\n}\n\n.mortem-fc-weight-note-mobile'
          new_justify = '  justify-content: flex-start !important;\n}\n\n.mortem-fc-weight-note-mobile'
          assert css.count(old_justify) == 1
          css = css.replace(old_justify, new_justify, 1)

          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Check diff and syntax
        shell: bash
        run: |
          git diff --check
          python -m compileall -q app/full_factor_panel.py app/full_mobile_compact.py
          python - <<'PY'
          from pathlib import Path
          panel = Path('app/full_factor_panel.py').read_text(encoding='utf-8')
          css = Path('app/full_mobile_compact.py').read_text(encoding='utf-8')
          assert 'def _apply_fc_range' in panel
          assert '"Usalo"' in panel
          assert 'if full_mobile:' in panel
          assert 'and not full_mobile' in panel
          assert 'FC suggerito:&nbsp;' in panel
          assert 'border: 1.5px solid var(--st-primary-color)' in css
          assert 'justify-content: flex-start' in css
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/full_factor_panel.py app/full_mobile_compact.py
          git diff --cached --quiet && exit 0
          git commit -m "Uniforma applicazione FC suggerito mobile"
          git push origin HEAD:tmp-mobile-fc-usalo-range
