name: Temporary mobile FC layout fixes

on:
  push:
    branches:
      - tmp-mobile-fc-layout-fixes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mobile-fc-layout-fixes
          fetch-depth: 0

      - name: Apply exact mobile FC layout fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          panel_path = Path('app/full_factor_panel.py')
          panel = panel_path.read_text(encoding='utf-8')

          old_fc = '''def _fc_box(f_finale: float, f_base: float | None, peso_corrente: float | None):
              pal = _fc_palette()
              main = (
                  f'<div style="background:{pal["bg"]};color:{pal["text"]};'
                  f'border:1px solid {pal["border"]};border-radius:8px;'
                  f'padding:10px;font-weight:600;">'
                  f'{i18n.ui_text("full.fc_suggested", value=f_finale)}'
                  f'</div>'
              )
              side = ""
              if f_base is not None and peso_corrente is not None and abs(f_finale - f_base) > 1e-9:
                  side = (
                      f'<div style="color:{pal["note"]};padding:10px 2px 0 2px;font-size:0.92em;">'
                      f'{i18n.ui_text("full.fc_adjusted_for_weight", weight=peso_corrente, base=f_base)}'
                      f'</div>'
                  )
              st.markdown(main + side, unsafe_allow_html=True)
          '''
          old_fc = old_fc.replace('          ', '', 1) if False else old_fc
          # Dedent embedded source exactly.
          import textwrap
          old_fc = textwrap.dedent(old_fc)
          new_fc = textwrap.dedent('''
          def _fc_box(f_finale: float, f_base: float | None, peso_corrente: float | None):
              pal = _fc_palette()
              main = (
                  f'<div style="background:{pal["bg"]};color:{pal["text"]};'
                  f'border:1px solid {pal["border"]};border-radius:8px;'
                  f'padding:10px;font-weight:600;">'
                  f'{i18n.ui_text("full.fc_suggested", value=f_finale)}'
                  f'</div>'
              )
              side_text = ""
              if f_base is not None and peso_corrente is not None and abs(f_finale - f_base) > 1e-9:
                  side_text = i18n.ui_text(
                      "full.fc_adjusted_for_weight", weight=peso_corrente, base=f_base
                  )

              if full_device_is_mobile() and side_text:
                  st.markdown(main, unsafe_allow_html=True)
                  st.markdown(
                      f'<div class="mortem-fc-weight-note-mobile">{side_text}</div>',
                      unsafe_allow_html=True,
                  )
              else:
                  side = (
                      f'<div style="color:{pal["note"]};padding:10px 2px 0 2px;font-size:0.92em;">'
                      f'{side_text}'
                      f'</div>'
                  ) if side_text else ""
                  st.markdown(main + side, unsafe_allow_html=True)
          ''').lstrip()
          assert panel.count(old_fc) == 1, panel.count(old_fc)
          panel = panel.replace(old_fc, new_fc, 1)

          start_marker = '''        with st.container(
              horizontal=True,
              wrap=False,
              gap="xsmall",
              key=k("switch_row"),
          ):
          '''
          start_marker = textwrap.dedent(start_marker).lstrip()
          start = panel.index(start_marker)
          end = panel.index('    elif mobile:\n', start)
          new_switch = textwrap.dedent('''
                  with st.container(
                      horizontal=True,
                      wrap=False,
                      horizontal_alignment="distribute",
                      vertical_alignment="center",
                      gap="small",
                      key=k("switch_row"),
                  ):
                      with st.container(
                          horizontal=True,
                          wrap=False,
                          vertical_alignment="center",
                          gap="xsmall",
                          width="content",
                          key=k("vest_group"),
                      ):
                          with st.container(width="content", key=k("vest_slot")):
                              toggle_vestito = st.toggle(
                                  "Vestiti/coperte",
                                  key=k("toggle_vestito"), value=False
                              )
                          with st.container(width="content", key=k("vest_help_slot")):
                              with st.popover("?"):
                                  st.markdown(
                                      """
                                      <div class="mortem-help-copy">
                                        <div class="mortem-help-copy-intro">Esempi orientativi per classificare vestiti, teli e coperte:</div>
                                        <div class="mortem-help-copy-bullet">• Vestiti/teli leggeri: T-shirt, camicia, lenzuolo o telo sottile.</div>
                                        <div class="mortem-help-copy-bullet">• Vestiti/teli pesanti: maglione, felpa pesante, giacca o telo spesso.</div>
                                        <div class="mortem-help-copy-bullet">• Coperte medie: coperta di normale spessore.</div>
                                        <div class="mortem-help-copy-bullet">• Coperte pesanti/termiche: piumone pesante o mantellina/coperta termica.</div>
                                        <div class="mortem-help-copy-intro">Conta separatamente ogni strato effettivamente presente sul corpo.</div>
                                      </div>
                                      """,
                                      unsafe_allow_html=True,
                                  )
                      with st.container(width="content", key=k("corr_slot")):
                          corr_placeholder = st.empty()
          ''').lstrip('\n')
          assert panel[start:end].count('Vestiti/coperte') == 1
          panel = panel[:start] + new_switch + panel[end:]

          label_replacements = {
              '                "Strati leggeri",': '                "Vestiti/teli leggeri",',
              '                "Strati pesanti",': '                "Vestiti/teli pesanti",',
          }
          for old, new in label_replacements.items():
              assert panel.count(old) == 1, (old, panel.count(old))
              panel = panel.replace(old, new, 1)

          panel_path.write_text(panel, encoding='utf-8')

          compact_path = Path('app/full_mobile_compact.py')
          compact = compact_path.read_text(encoding='utf-8')

          old_gap = '''  body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-full_fc_panel_mobile"] [class*="st-key-fcpanel_std_switch_row"],
            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-full_fc_panel_mobile"] [class*="st-key-fcpanel_caut_switch_row"] {
              margin-top: -0.12rem !important;
              margin-bottom: -0.12rem !important;
              padding-top: 0 !important;
              padding-bottom: 0 !important;
            }
          '''
          old_gap = textwrap.dedent(old_gap)
          new_gap = textwrap.dedent('''
            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-full_fc_panel_mobile"] [class*="st-key-fcpanel_std_switch_row"],
            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-full_fc_panel_mobile"] [class*="st-key-fcpanel_caut_switch_row"] {
              width: 100% !important;
              min-width: 0 !important;
              margin-top: 0.12rem !important;
              margin-bottom: -0.08rem !important;
              padding-top: 0 !important;
              padding-bottom: 0 !important;
            }

            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-fcpanel_std_vest_group"],
            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-fcpanel_caut_vest_group"] {
              width: max-content !important;
              min-width: max-content !important;
              flex-wrap: nowrap !important;
              align-items: center !important;
            }

            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-fcpanel_std_corr_slot"],
            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-fcpanel_caut_corr_slot"] {
              width: max-content !important;
              min-width: max-content !important;
              margin-left: auto !important;
            }
          ''')
          assert compact.count(old_gap) == 1, compact.count(old_gap)
          compact = compact.replace(old_gap, new_gap, 1)

          surface_old = textwrap.dedent('''
            /* La superficie resta un controllo distinto dal conteggio degli strati. */
            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-fcpanel_std_surface_select_mobile"] [data-testid="stSelectbox"] [data-baseweb="select"] > div,
            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-fcpanel_caut_surface_select_mobile"] [data-testid="stSelectbox"] [data-baseweb="select"] > div {
              background: color-mix(in srgb, var(--st-secondary-background-color) 86%, var(--st-primary-color) 14%) !important;
              border-color: color-mix(in srgb, var(--st-primary-color) 38%, transparent) !important;
            }
          ''')
          surface_new = textwrap.dedent('''
            /* La superficie è visivamente separata dal conteggio degli strati. */
            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-fcpanel_std_surface_select_mobile"],
            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-fcpanel_caut_surface_select_mobile"] {
              padding: 0.07rem !important;
              border: 1px solid color-mix(in srgb, var(--st-primary-color) 55%, transparent) !important;
              border-radius: 0.58rem !important;
              background: color-mix(in srgb, var(--st-secondary-background-color) 72%, var(--st-primary-color) 28%) !important;
            }

            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-fcpanel_std_surface_select_mobile"] [data-testid="stSelectbox"] [data-baseweb="select"] > div,
            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-fcpanel_caut_surface_select_mobile"] [data-testid="stSelectbox"] [data-baseweb="select"] > div {
              background: color-mix(in srgb, var(--st-secondary-background-color) 78%, var(--st-primary-color) 22%) !important;
              border-color: transparent !important;
              box-shadow: none !important;
            }
          ''')
          assert compact.count(surface_old) == 1, compact.count(surface_old)
          compact = compact.replace(surface_old, surface_new, 1)

          insert_marker = '  /* I quattro stepper vestiti sono volutamente più bassi degli altri V2. */\n'
          wide_css = textwrap.dedent('''
            /* I componenti numerici Full mobile occupano tutta la larghezza utile
               del wrapper Streamlit, non solo la larghezza intrinseca dell'iframe. */
            body:has([class*="st-key-stima_cautelativa_beta"])
            [data-testid="stElementContainer"]:has([class*="st-key-mortem_decimal_"]),
            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-mortem_decimal_"] {
              width: 100% !important;
              max-width: none !important;
              min-width: 0 !important;
              align-self: stretch !important;
            }

            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-mortem_decimal_"] iframe {
              width: 100% !important;
              max-width: none !important;
            }

            body:has([class*="st-key-stima_cautelativa_beta"])
            [data-testid="stHorizontalBlock"]:has([class*="st-key-mortem_decimal_"]) {
              width: 100% !important;
              max-width: none !important;
            }

            .mortem-fc-weight-note-mobile {
              box-sizing: border-box;
              width: 100%;
              margin: 0.06rem 0 0.20rem 0;
              padding: 0.10rem 0.12rem 0.16rem 0.12rem;
              font-size: 0.80rem;
              line-height: 1.28;
              white-space: normal;
              overflow: visible;
            }

            body:has([class*="st-key-stima_cautelativa_beta"])
            [data-testid="stElementContainer"]:has(.mortem-fc-weight-note-mobile) {
              width: 100% !important;
              overflow: visible !important;
              margin-bottom: 0.10rem !important;
            }

          ''')
          assert compact.count(insert_marker) == 1
          compact = compact.replace(insert_marker, wide_css + insert_marker, 1)

          compact_path.write_text(compact, encoding='utf-8')
          PY

      - name: Check diff and syntax
        shell: bash
        run: |
          git diff --check
          python -m compileall -q app/full_factor_panel.py app/full_mobile_compact.py
          python - <<'PY'
          from pathlib import Path
          panel = Path('app/full_factor_panel.py').read_text(encoding='utf-8')
          compact = Path('app/full_mobile_compact.py').read_text(encoding='utf-8')
          assert 'Vestiti/teli leggeri' in panel
          assert 'Vestiti/teli pesanti' in panel
          assert 'horizontal_alignment="distribute"' in panel
          assert 'key=k("vest_group")' in panel
          assert 'mortem-fc-weight-note-mobile' in panel
          assert 'margin-left: auto !important;' in compact
          assert 'align-self: stretch !important;' in compact
          assert 'background: color-mix(in srgb, var(--st-secondary-background-color) 72%, var(--st-primary-color) 28%)' in compact
          PY
          git diff -- app/full_factor_panel.py app/full_mobile_compact.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/full_factor_panel.py app/full_mobile_compact.py
          git commit -m "Rifinisce layout FC mobile"
          git push origin HEAD:tmp-mobile-fc-layout-fixes
