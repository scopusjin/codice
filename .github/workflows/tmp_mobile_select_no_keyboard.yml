name: Temporary mobile select no keyboard patch

on:
  push:
    branches:
      - tmp-mobile-select-no-keyboard

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mobile-select-no-keyboard
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply exact selectbox patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path("Stima_epoca_decesso.py")
          text = main_path.read_text(encoding="utf-8")

          marker = '''# 📌 2. Ipostasi e rigidità — RIQUADRO
          with st.container(border=True):'''
          replacement = '''# 📌 2. Ipostasi e rigidità — RIQUADRO
          full_select_filter_mode = None if full_device_is_mobile() else "fuzzy"
          with st.container(border=True):'''
          assert text.count(marker) == 1
          text = text.replace(marker, replacement, 1)

          livor_old = '''            key="selettore_macchie_ui",
                      label_visibility="collapsed"
                  )'''
          livor_new = '''            key="selettore_macchie_ui",
                      label_visibility="collapsed",
                      filter_mode=full_select_filter_mode,
                  )'''
          assert text.count(livor_old) == 1
          text = text.replace(livor_old, livor_new, 1)

          rigor_old = '''            key="selettore_rigidita_ui",
                      label_visibility="collapsed"
                  )'''
          rigor_new = '''            key="selettore_rigidita_ui",
                      label_visibility="collapsed",
                      filter_mode=full_select_filter_mode,
                  )'''
          assert text.count(rigor_old) == 1
          text = text.replace(rigor_old, rigor_new, 1)
          main_path.write_text(text, encoding="utf-8")

          panel_path = Path("app/full_factor_panel.py")
          panel = panel_path.read_text(encoding="utf-8")
          panel_old = '''        elif full_mobile:
                      select_kwargs["label_visibility"] = "collapsed"
                      select_kwargs["format_func"] = _full_mobile_surface_caption
          '''
          panel_new = '''        elif full_mobile:
                      select_kwargs["label_visibility"] = "collapsed"
                      select_kwargs["format_func"] = _full_mobile_surface_caption
                      select_kwargs["filter_mode"] = None
          '''
          assert panel.count(panel_old) == 1
          panel = panel.replace(panel_old, panel_new, 1)
          panel_path.write_text(panel, encoding="utf-8")
          PY

      - name: Check API diff and syntax
        shell: bash
        run: |
          python - <<'PY'
          import inspect
          import streamlit as st
          assert "filter_mode" in inspect.signature(st.selectbox).parameters
          PY
          git diff --check
          python -m compileall -q Stima_epoca_decesso.py app/full_factor_panel.py
          git diff -- Stima_epoca_decesso.py app/full_factor_panel.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Stima_epoca_decesso.py app/full_factor_panel.py
          git commit -m "Disabilita ricerca nei select Full mobile"
          git push origin HEAD:tmp-mobile-select-no-keyboard
