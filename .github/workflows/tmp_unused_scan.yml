name: Temp unused code scan

on:
  push:
    branches:
      - refactor-tanatology-keys
    paths:
      - .github/workflows/tmp_unused_scan.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-tanatology-keys
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vulture
        run: python -m pip install --disable-pip-version-check vulture
      - name: Scan Python code
        run: |
          vulture Stima_epoca_decesso.py app pages tests --min-confidence 60 || true
          echo '=== SYMBOL OCCURRENCES ==='
          grep -RInE --include='*.py' '(_lbl_ore|_bold|_fc_box|clear_fc_suggestions_global|autosync_fc_if_needed|_classifica_superficie|_classifica_superficie_from_key|_format_stato|_format_corrente|_format_indumenti|_format_coperte|build_summary_html|agg_max_raw|InvalidOperation)' Stima_epoca_decesso.py app pages tests || true
