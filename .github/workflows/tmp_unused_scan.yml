name: Temp confirmed dead-code cleanup

on:
  push:
    branches:
      - refactor-tanatology-keys
    paths:
      - .github/workflows/tmp_unused_scan.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-tanatology-keys
      - name: Apply confirmed cleanup
        run: |
          python - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          # factor_calc: import inutilizzato + vecchi formatter privati senza riferimenti.
          path = "app/factor_calc.py"
          text = read(path)
          old = "from decimal import Decimal, ROUND_FLOOR, InvalidOperation"
          assert text.count(old) == 1
          text = text.replace(old, "from decimal import Decimal, ROUND_FLOOR", 1)
          start = text.index("def _classifica_superficie(")
          end = text.index("def build_cf_description(", start)
          text = text[:start] + text[end:]
          write(path, text)

          # full_factor_panel: vecchio renderer FC privato, non più richiamato.
          path = "app/full_factor_panel.py"
          text = read(path)
          start = text.index("def _fc_palette():")
          end = text.index("def _sync_fc_range_from_suggestions():", start)
          text = text[:start] + text[end:]
          write(path, text)

          # textgen: helper HTML privato non richiamato.
          path = "app/textgen.py"
          text = read(path)
          old = 'def _bold(txt: str) -> str:\n    return f"<b>{txt}</b>"\n\n'
          assert text.count(old) == 1
          text = text.replace(old, "", 1)
          write(path, text)

          # cautelativa: helper privato inutilizzato e parametro keyword ignorato.
          path = "app/cautelativa.py"
          text = read(path)
          old = "def _lbl_ore(x: float) -> str:\n    \"\"\"Ritorna 'ora' al singolare se =1, altrimenti 'ore'.\"\"\"\n    return \"ora\" if abs(x - 1.0) < 1e-9 else \"ore\"\n\n\n"
          assert text.count(old) == 1
          text = text.replace(old, "", 1)
          old = "peso_stimato=peso_stimato, agg_max_raw=agg_max_all,"
          assert text.count(old) == 1
          text = text.replace(old, "peso_stimato=peso_stimato,", 1)
          old = "*, peso_stimato: bool, agg_max_raw: float"
          assert text.count(old) == 1
          text = text.replace(old, "*, peso_stimato: bool", 1)
          write(path, text)

          # Test: stessa chiamata, senza il parametro ignorato.
          path = "tests/test_cautelativa_presentational_i18n.py"
          text = read(path)
          old = "peso_stimato=False, agg_max_raw=10.0,"
          assert text.count(old) == 1
          text = text.replace(old, "peso_stimato=False,", 1)
          write(path, text)
          PY

          python -m compileall -q app Stima_epoca_decesso.py pages tests
      - name: Commit cleanup
        run: |
          git config user.name "scopusjin"
          git config user.email "matteo.moretti19@gmail.com"
          git add app/factor_calc.py app/full_factor_panel.py app/textgen.py app/cautelativa.py tests/test_cautelativa_presentational_i18n.py
          git diff --cached --check
          git diff --cached --quiet && exit 0
          git commit -m "Rimuove helper privati inutilizzati"
          git push origin HEAD:refactor-tanatology-keys
