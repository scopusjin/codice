name: Temp unused code rescan

on:
  push:
    branches:
      - refactor-tanatology-keys
    paths:
      - .github/workflows/tmp_unused_scan.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-tanatology-keys
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install vulture
        run: python -m pip install --disable-pip-version-check vulture
      - name: Rescan Python code
        run: vulture Stima_epoca_decesso.py app pages tests --min-confidence 60 || true
