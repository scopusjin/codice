name: Temporary Henssge and Potente text update

on:
  push:
    branches:
      - refactor-tanatology-keys
    paths:
      - .github/tmp_text_henssge_potente_trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor-tanatology-keys
          fetch-depth: 0

      - name: Apply text patch
        run: python .github/tmp_text_henssge_potente_patch.py

      - name: Check diff and syntax
        run: |
          git diff --check
          python -m compileall -q app/graphing.py app/locales/it.py

      - name: Commit text update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/graphing.py app/locales/it.py
          git diff --cached --quiet && exit 0
          git commit -m "Aggiorna testi Henssge e Potente"
          git push origin HEAD:refactor-tanatology-keys
