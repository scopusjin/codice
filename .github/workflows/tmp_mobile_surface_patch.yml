name: Temporary mobile surface compact patch

on:
  push:
    branches:
      - tmp-mobile-surface-compact

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mobile-surface-compact
          fetch-depth: 0

      - name: Apply exact mobile surface patch
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("app/full_factor_panel.py")
          text = path.read_text(encoding="utf-8")

          helper_old = '''def _safe_int(x):
              try:
                  return int(x)
              except Exception:
                  return 0


          '''
          helper_new = helper_old + '''_FULL_MOBILE_SURFACE_PLACEHOLDER = "Superficie di appoggio"


          def _full_mobile_surface_caption(value: str) -> str:
              if value == _FULL_MOBILE_SURFACE_PLACEHOLDER:
                  return value
              text = str(value).rstrip(".")
              if not text:
                  return text
              return f"Su {text[:1].lower()}{text[1:]}"


          '''
          assert text.count(helper_old) == 1, "helper anchor changed"
          text = text.replace(helper_old, helper_new, 1)

          surface_old = '''    superficie_display_selected = None if mobile else "/"
              if stato_corpo == "Asciutto":
                  nudo_eff = ((not toggle_vestito)
                              or (counts.sottili == counts.spessi == counts.coperte_medie == counts.coperte_pesanti == 0))
                  options_display = list(surface_labels())
                  if not nudo_eff:
                      excluded_surface = surface_label(SURFACE_THICK_METAL_OUTDOOR)
                      options_display = [o for o in options_display if o != excluded_surface]
                  prev_display = st.session_state.get(k("superficie_display_sel"))
                  if prev_display not in options_display:
                      prev_display = options_display[0]

                  select_kwargs = dict(
                      index=options_display.index(prev_display),
                      key=k("superficie_display_sel")
                  )
                  if mobile:
                      select_kwargs["label_visibility"] = "visible"
                  superficie_display_label = st.selectbox(
                      i18n.ui_text(f"{scope}.support_surface"),
                      options_display,
                      **select_kwargs
                  )
                  superficie_display_selected = surface_legacy_value(superficie_display_label)
          '''
          surface_new = '''    surface_placeholder_selected = False
              superficie_display_selected = None if mobile else "/"
              if stato_corpo == "Asciutto":
                  nudo_eff = ((not toggle_vestito)
                              or (counts.sottili == counts.spessi == counts.coperte_medie == counts.coperte_pesanti == 0))
                  options_display = list(surface_labels())
                  if not nudo_eff:
                      excluded_surface = surface_label(SURFACE_THICK_METAL_OUTDOOR)
                      options_display = [o for o in options_display if o != excluded_surface]

                  select_options = options_display
                  if full_mobile:
                      select_options = [_FULL_MOBILE_SURFACE_PLACEHOLDER, *options_display]

                  prev_display = st.session_state.get(k("superficie_display_sel"))
                  if prev_display not in select_options:
                      prev_display = _FULL_MOBILE_SURFACE_PLACEHOLDER if full_mobile else options_display[0]

                  select_kwargs = dict(
                      index=select_options.index(prev_display),
                      key=k("superficie_display_sel")
                  )
                  if mobile:
                      select_kwargs["label_visibility"] = "visible"
                  elif full_mobile:
                      select_kwargs["label_visibility"] = "collapsed"
                      select_kwargs["format_func"] = _full_mobile_surface_caption

                  superficie_display_label = st.selectbox(
                      i18n.ui_text(f"{scope}.support_surface"),
                      select_options,
                      **select_kwargs
                  )
                  if full_mobile and superficie_display_label == _FULL_MOBILE_SURFACE_PLACEHOLDER:
                      # Placeholder neutro: nessun effetto proprio della superficie.
                      # Per le correnti mantiene la stessa classe INDIFFERENTE del
                      # precedente default (prima superficie dell'elenco).
                      surface_placeholder_selected = True
                      superficie_display_selected = surface_legacy_value(options_display[0])
                  else:
                      superficie_display_selected = surface_legacy_value(superficie_display_label)
          '''
          assert text.count(surface_old) == 1, "surface block changed"
          text = text.replace(surface_old, surface_new, 1)

          result_old = '''    result = compute_factor(
                  stato=stato_corpo, acqua=None, counts=counts,
                  superficie_display=superficie_display_selected if stato_corpo == "Asciutto" else None,
                  correnti_aria=correnti_presenti,
                  peso=peso_eff,
                  tabella2_df=tabella2
              )
              return result, peso_eff, False
          '''
          result_new = '''    result = compute_factor(
                  stato=stato_corpo, acqua=None, counts=counts,
                  superficie_display=superficie_display_selected if stato_corpo == "Asciutto" else None,
                  correnti_aria=correnti_presenti,
                  peso=peso_eff,
                  tabella2_df=tabella2
              )
              if full_mobile and surface_placeholder_selected:
                  result.riassunto["superficie"] = "/"
              return result, peso_eff, False
          '''
          assert text.count(result_old) == 1, "result block changed"
          text = text.replace(result_old, result_new, 1)
          path.write_text(text, encoding="utf-8")

          css_path = Path("app/full_mobile_compact.py")
          css = css_path.read_text(encoding="utf-8")
          css_anchor = '''  body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-full_fc_panel_mobile"] {
              width: 100% !important;
              min-width: 0 !important;
              margin: 0 !important;
              padding: 0.34rem 0.24rem !important;
              border: 0 !important;
              border-radius: 0.55rem !important;
              box-shadow: none !important;
              background: rgba(33, 150, 243, 0.055) !important;
            }
          '''
          css_extra = css_anchor + '''
            /* Il pannello FC mobile usa meno spazio verticale tra stato del corpo,
               switch e superficie di appoggio. */
            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-full_fc_panel_mobile"][data-testid="stVerticalBlock"],
            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-full_fc_panel_mobile"] > [data-testid="stVerticalBlock"] {
              gap: 0.16rem !important;
            }

            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-full_fc_panel_mobile"] [class*="st-key-fcpanel_std_switch_row"],
            body:has([class*="st-key-stima_cautelativa_beta"])
            [class*="st-key-full_fc_panel_mobile"] [class*="st-key-fcpanel_caut_switch_row"] {
              margin-top: -0.12rem !important;
              margin-bottom: -0.12rem !important;
              padding-top: 0 !important;
              padding-bottom: 0 !important;
            }
          '''
          assert css.count(css_anchor) == 1, "compact CSS anchor changed"
          css = css.replace(css_anchor, css_extra, 1)
          css_path.write_text(css, encoding="utf-8")
          PY

      - name: Check diff and syntax
        run: |
          git diff --check
          python -m compileall -q app/full_factor_panel.py app/full_mobile_compact.py
          git diff -- app/full_factor_panel.py app/full_mobile_compact.py

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/full_factor_panel.py app/full_mobile_compact.py
          git commit -m "Compatta superficie appoggio su Full mobile"
          git push origin HEAD:tmp-mobile-surface-compact
