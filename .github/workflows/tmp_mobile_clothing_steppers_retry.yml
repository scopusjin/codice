name: Temporary mobile clothing steppers patch retry

on:
  push:
    branches:
      - tmp-mobile-clothing-steppers

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mobile-clothing-steppers
          fetch-depth: 0

      - name: Apply exact clothing stepper patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          init_path = Path('app/__init__.py')
          init = init_path.read_text(encoding='utf-8')
          keys_marker = '''    "peso_widget",\n}'''
          keys_replacement = '''    "peso_widget",\n    "fcpanel_std_strati_sottili",\n    "fcpanel_std_strati_spessi",\n    "fcpanel_std_coperte_medie",\n    "fcpanel_std_coperte_pesanti",\n    "fcpanel_caut_strati_sottili",\n    "fcpanel_caut_strati_spessi",\n    "fcpanel_caut_coperte_medie",\n    "fcpanel_caut_coperte_pesanti",\n}'''
          assert init.count(keys_marker) == 1
          init = init.replace(keys_marker, keys_replacement, 1)

          units_marker = '''    "fc_other_val": "",\n}'''
          units_replacement = '''    "fc_other_val": "",\n    "fcpanel_std_strati_sottili": "",\n    "fcpanel_std_strati_spessi": "",\n    "fcpanel_std_coperte_medie": "",\n    "fcpanel_std_coperte_pesanti": "",\n    "fcpanel_caut_strati_sottili": "",\n    "fcpanel_caut_strati_spessi": "",\n    "fcpanel_caut_coperte_medie": "",\n    "fcpanel_caut_coperte_pesanti": "",\n}'''
          assert init.count(units_marker) == 1
          init = init.replace(units_marker, units_replacement, 1)
          init_path.write_text(init, encoding='utf-8')

          v2_path = Path('app/decimal_number_input_v2.py')
          v2 = v2_path.read_text(encoding='utf-8')
          v2_marker = '''    "mortem_decimal_fc_other_val",\n}'''
          v2_replacement = '''    "mortem_decimal_fc_other_val",\n    "mortem_decimal_fcpanel_std_strati_sottili",\n    "mortem_decimal_fcpanel_std_strati_spessi",\n    "mortem_decimal_fcpanel_std_coperte_medie",\n    "mortem_decimal_fcpanel_std_coperte_pesanti",\n    "mortem_decimal_fcpanel_caut_strati_sottili",\n    "mortem_decimal_fcpanel_caut_strati_spessi",\n    "mortem_decimal_fcpanel_caut_coperte_medie",\n    "mortem_decimal_fcpanel_caut_coperte_pesanti",\n}'''
          assert v2.count(v2_marker) == 1
          v2 = v2.replace(v2_marker, v2_replacement, 1)
          v2_path.write_text(v2, encoding='utf-8')

          panel_path = Path('app/full_factor_panel.py')
          panel = panel_path.read_text(encoding='utf-8')
          start = panel.index('        item_col = i18n.ui_text("msil.item_column") if mobile else "--"\n')
          end_marker = '        n_cop_pesanti = vals.get(label_coperte_pesanti, 0) if stato_corpo == "Asciutto" else 0\n'
          end = panel.index(end_marker, start) + len(end_marker)
          replacement = '''        if full_mobile:\n            n_sottili = _safe_int(st.number_input(\n                label_sottili,\n                value=st.session_state.get(k("strati_sottili"), 0),\n                min_value=0, max_value=8, step=1, format="%.0f",\n                key=k("strati_sottili"), label_visibility="collapsed",\n            ))\n            n_spessi = _safe_int(st.number_input(\n                label_spessi,\n                value=st.session_state.get(k("strati_spessi"), 0),\n                min_value=0, max_value=8, step=1, format="%.0f",\n                key=k("strati_spessi"), label_visibility="collapsed",\n            ))\n            if stato_corpo == "Asciutto":\n                n_cop_medie = _safe_int(st.number_input(\n                    label_coperte_medie,\n                    value=st.session_state.get(k("coperte_medie"), 0),\n                    min_value=0, max_value=8, step=1, format="%.0f",\n                    key=k("coperte_medie"), label_visibility="collapsed",\n                ))\n                n_cop_pesanti = _safe_int(st.number_input(\n                    label_coperte_pesanti,\n                    value=st.session_state.get(k("coperte_pesanti"), 0),\n                    min_value=0, max_value=8, step=1, format="%.0f",\n                    key=k("coperte_pesanti"), label_visibility="collapsed",\n                ))\n        else:\n            item_col = i18n.ui_text("msil.item_column") if mobile else "--"\n            count_col = i18n.ui_text(f"{scope}.count_column")\n            defaults = {\n                label_sottili: st.session_state.get(k("strati_sottili"), 0),\n                label_spessi: st.session_state.get(k("strati_spessi"), 0),\n            }\n            if stato_corpo == "Asciutto":\n                defaults.update({\n                    label_coperte_medie: st.session_state.get(k("coperte_medie"), 0),\n                    label_coperte_pesanti: st.session_state.get(k("coperte_pesanti"), 0),\n                })\n\n            df = pd.DataFrame([{item_col: nome, count_col: val} for nome, val in defaults.items()])\n            if not mobile:\n                st.markdown("""\n                <style>\n                [data-testid="stDataFrameContainer"] thead {display: none;}\n                [data-testid="stElementToolbar"] {display: none;}\n                [data-testid="stDataFrameContainer"] tbody th {display: none;}\n                </style>\n                """, unsafe_allow_html=True)\n\n            edited = st.data_editor(\n                df, hide_index=True, use_container_width=True,\n                column_config={\n                    item_col: st.column_config.TextColumn(disabled=True, width="medium"),\n                    count_col: st.column_config.NumberColumn(min_value=0, max_value=8, step=1, width="small"),\n                },\n            )\n            if mobile:\n                vals = {r[item_col]: _safe_int(r[count_col]) for _, r in edited.iterrows()}\n            else:\n                vals = {r[item_col]: int(r[count_col] or 0) for _, r in edited.iterrows()}\n\n            n_sottili = vals.get(label_sottili, 0)\n            n_spessi = vals.get(label_spessi, 0)\n            n_cop_medie = vals.get(label_coperte_medie, 0) if stato_corpo == "Asciutto" else 0\n            n_cop_pesanti = vals.get(label_coperte_pesanti, 0) if stato_corpo == "Asciutto" else 0\n'''
          panel = panel[:start] + replacement + panel[end:]
          panel_path.write_text(panel, encoding='utf-8')
          PY

      - name: Check diff and syntax
        shell: bash
        run: |
          git diff --check
          python -m compileall -q app/full_factor_panel.py app/__init__.py app/decimal_number_input_v2.py
          python - <<'PY'
          from pathlib import Path
          init = Path('app/__init__.py').read_text(encoding='utf-8')
          v2 = Path('app/decimal_number_input_v2.py').read_text(encoding='utf-8')
          panel = Path('app/full_factor_panel.py').read_text(encoding='utf-8')
          logical = [
              'fcpanel_std_strati_sottili', 'fcpanel_std_strati_spessi',
              'fcpanel_std_coperte_medie', 'fcpanel_std_coperte_pesanti',
              'fcpanel_caut_strati_sottili', 'fcpanel_caut_strati_spessi',
              'fcpanel_caut_coperte_medie', 'fcpanel_caut_coperte_pesanti',
          ]
          for key in logical:
              assert init.count(f'"{key}"') >= 2
              assert f'"mortem_decimal_{key}"' in v2
          assert 'if full_mobile:\n            n_sottili = _safe_int(st.number_input(' in panel
          assert 'else:\n            item_col = i18n.ui_text("msil.item_column") if mobile else "--"' in panel
          PY
          git diff -- app/full_factor_panel.py app/__init__.py app/decimal_number_input_v2.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/full_factor_panel.py app/__init__.py app/decimal_number_input_v2.py
          git commit -m "Sostituisce tabella vestiti con stepper mobile"
          git push origin HEAD:tmp-mobile-clothing-steppers
