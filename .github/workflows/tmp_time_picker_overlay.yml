name: Temporary time picker overlay

on:
  push:
    branches:
      - refactor-tanatology-keys
    paths:
      - .tmp_time_picker_overlay.py

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor-tanatology-keys
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply mobile picker overlay
        run: python .tmp_time_picker_overlay.py

      - name: Compile Python sources
        run: python -m compileall -q app Stima_epoca_decesso.py pages

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Commit revision and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp_time_picker_overlay.yml .tmp_time_picker_overlay.py
          git add app/native_time_picker.py
          git commit -m "Sovrappone picker orario su mobile"
          git push origin HEAD:refactor-tanatology-keys
