name: Temporary mobile use button arrow

on:
  push:
    branches:
      - tmp-mobile-use-button-arrow-final

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mobile-use-button-arrow-final
          fetch-depth: 0

      - name: Apply mobile UI patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          panel_path = Path('app/full_factor_panel.py')
          panel = panel_path.read_text(encoding='utf-8')

          old_width = '                width="stretch",\n                key=k("vest_group"),\n'
          new_width = '                width="content",\n                key=k("vest_group"),\n'
          assert panel.count(old_width) == 1
          panel = panel.replace(old_width, new_width, 1)

          old_gap = '                gap: 0.5rem !important;\n'
          new_gap = '                gap: 0.30rem !important;\n'
          assert panel.count(old_gap) == 1
          panel = panel.replace(old_gap, new_gap, 1)

          old_button = '''                st.button(\n                    "✅ Usa",\n                    on_click=_apply_fc, args=(result.fattore_finale, result.riassunto),\n                    key=f"{key_prefix}_btn_usa_fc{suffix}",\n                )\n'''
          new_button = '''                st.button(\n                    "→ Usa",\n                    type="primary",\n                    on_click=_apply_fc, args=(result.fattore_finale, result.riassunto),\n                    key=f"{key_prefix}_btn_usa_fc{suffix}",\n                )\n'''
          assert panel.count(old_button) == 1
          panel = panel.replace(old_button, new_button, 1)
          panel_path.write_text(panel, encoding='utf-8')

          css_path = Path('app/full_mobile_compact.py')
          css = css_path.read_text(encoding='utf-8')

          old_corr = '''body:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_std_corr_slot"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_caut_corr_slot"] {\n  flex: 0 0 auto !important;\n  width: max-content !important;\n  min-width: max-content !important;\n  max-width: 44% !important;\n  margin-left: auto !important;\n}\n'''
          new_corr = '''body:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_std_corr_slot"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_caut_corr_slot"] {\n  flex: 0 0 auto !important;\n  width: max-content !important;\n  min-width: max-content !important;\n  max-width: none !important;\n  margin-left: auto !important;\n  overflow: visible !important;\n}\n'''
          assert css.count(old_corr) == 1
          css = css.replace(old_corr, new_corr, 1)

          old_vest = '''body:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_std_vest_group"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_caut_vest_group"] {\n  flex: 1 1 0 !important;\n  width: auto !important;\n  min-width: 0 !important;\n  max-width: 56% !important;\n}\n'''
          new_vest = '''body:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_std_vest_group"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_caut_vest_group"] {\n  flex: 0 0 auto !important;\n  width: max-content !important;\n  min-width: max-content !important;\n  max-width: none !important;\n  overflow: visible !important;\n}\n'''
          assert css.count(old_vest) == 1
          css = css.replace(old_vest, new_vest, 1)

          old_button_css = '''body:has([class*="st-key-stima_cautelativa_beta"])\n[class*="fc_apply_action_mobile"] button {\n  height: 2.25rem !important;\n  min-height: 2.25rem !important;\n  max-height: 2.25rem !important;\n  margin: 0 !important;\n  padding: 0 0.52rem !important;\n  border-top: 0 !important;\n  border-right: 0 !important;\n  border-bottom: 0 !important;\n  border-left: 1px solid color-mix(in srgb, var(--st-primary-color) 45%, transparent) !important;\n  border-radius: 0 !important;\n  background: color-mix(in srgb, var(--st-primary-color) 24%, transparent) !important;\n  white-space: nowrap !important;\n}\n'''
          new_button_css = '''body:has([class*="st-key-stima_cautelativa_beta"])\n[class*="fc_apply_action_mobile"] button {\n  height: 1.92rem !important;\n  min-height: 1.92rem !important;\n  max-height: 1.92rem !important;\n  margin: 0 0.20rem 0 0 !important;\n  padding: 0 0.58rem !important;\n  border: 1px solid var(--st-primary-color) !important;\n  border-radius: 0.46rem !important;\n  background: var(--st-primary-color) !important;\n  color: white !important;\n  font-weight: 650 !important;\n  white-space: nowrap !important;\n}\n'''
          assert css.count(old_button_css) == 1
          css = css.replace(old_button_css, new_button_css, 1)

          old_wrappers = '''body:has([class*="st-key-stima_cautelativa_beta"])\n[class*="fc_apply_action_mobile"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="fc_apply_action_mobile"] > [data-testid="stVerticalBlock"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="fc_apply_action_mobile"] [data-testid="stElementContainer"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="fc_apply_action_mobile"] [data-testid="stButton"] {\n  height: 2.25rem !important;\n  min-height: 2.25rem !important;\n  max-height: 2.25rem !important;\n  margin: 0 !important;\n  padding: 0 !important;\n}\n'''
          new_wrappers = '''body:has([class*="st-key-stima_cautelativa_beta"])\n[class*="fc_apply_action_mobile"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="fc_apply_action_mobile"] > [data-testid="stVerticalBlock"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="fc_apply_action_mobile"] [data-testid="stElementContainer"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="fc_apply_action_mobile"] [data-testid="stButton"] {\n  height: 2.25rem !important;\n  min-height: 2.25rem !important;\n  max-height: 2.25rem !important;\n  margin: 0 !important;\n  padding: 0 !important;\n  display: flex !important;\n  align-items: center !important;\n  justify-content: flex-end !important;\n}\n'''
          assert css.count(old_wrappers) == 1
          css = css.replace(old_wrappers, new_wrappers, 1)

          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Check diff and syntax
        shell: bash
        run: |
          git diff --check
          python -m compileall -q app/full_factor_panel.py app/full_mobile_compact.py
          python - <<'PY'
          from pathlib import Path
          panel = Path('app/full_factor_panel.py').read_text(encoding='utf-8')
          css = Path('app/full_mobile_compact.py').read_text(encoding='utf-8')
          assert '"→ Usa"' in panel
          assert 'type="primary"' in panel
          assert 'max-width: 44%' not in css
          assert 'max-width: 56%' not in css
          assert 'background: var(--st-primary-color)' in css
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/full_factor_panel.py app/full_mobile_compact.py
          git diff --cached --quiet && exit 0
          git commit -m "Rende evidente pulsante Usa mobile"
          git push origin HEAD:tmp-mobile-use-button-arrow-final
