name: Temporary mobile corr FC refine

on:
  push:
    branches:
      - tmp-mobile-corr-fc-refine-last

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mobile-corr-fc-refine-last
          fetch-depth: 0

      - name: Apply mobile refinements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          panel_path = Path('app/full_factor_panel.py')
          panel = panel_path.read_text(encoding='utf-8')

          old_vest = '''                width="content",\n                key=k("vest_group"),\n'''
          new_vest = '''                width="stretch",\n                key=k("vest_group"),\n'''
          assert panel.count(old_vest) == 1
          panel = panel.replace(old_vest, new_vest, 1)

          old_corr = '''            with st.container(\n                horizontal=True,\n                wrap=False,\n                horizontal_alignment="right",\n                vertical_alignment="center",\n                width="stretch",\n                key=k("corr_slot"),\n            ):\n                corr_placeholder = st.empty()\n'''
          new_corr = '''            with st.container(width="content", key=k("corr_slot")):\n                corr_placeholder = st.empty()\n'''
          assert panel.count(old_corr) == 1
          panel = panel.replace(old_corr, new_corr, 1)

          old_fc = '''                    f'<div class="mortem-fc-inline-result">FC suggerito: <strong>{result.fattore_finale:.2f}</strong></div>',\n'''
          new_fc = '''                    f'<div class="mortem-fc-inline-result">FC suggerito:&nbsp;<strong>{result.fattore_finale:.2f}</strong></div>',\n'''
          assert panel.count(old_fc) == 1
          panel = panel.replace(old_fc, new_fc, 1)
          panel_path.write_text(panel, encoding='utf-8')

          css_path = Path('app/full_mobile_compact.py')
          css = css_path.read_text(encoding='utf-8')

          old_corr_css = '''body:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_std_corr_slot"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_caut_corr_slot"] {\n  flex: 1 1 0 !important;\n  width: auto !important;\n  min-width: 0 !important;\n  max-width: 100% !important;\n  margin-left: auto !important;\n  justify-content: flex-end !important;\n}\n\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_std_corr_slot"] [data-testid="stToggle"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_caut_corr_slot"] [data-testid="stToggle"] {\n  width: max-content !important;\n  min-width: max-content !important;\n  max-width: max-content !important;\n  margin-left: auto !important;\n}\n\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_std_vest_group"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_caut_vest_group"] {\n  flex: 0 1 auto !important;\n  min-width: 0 !important;\n}\n'''
          new_corr_css = '''body:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_std_corr_slot"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_caut_corr_slot"] {\n  flex: 0 0 auto !important;\n  width: max-content !important;\n  min-width: max-content !important;\n  max-width: 44% !important;\n  margin-left: auto !important;\n}\n\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_std_corr_slot"] [data-testid="stToggle"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_caut_corr_slot"] [data-testid="stToggle"] {\n  width: max-content !important;\n  min-width: max-content !important;\n  max-width: max-content !important;\n  margin-left: 0 !important;\n}\n\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_std_vest_group"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="st-key-fcpanel_caut_vest_group"] {\n  flex: 1 1 0 !important;\n  width: auto !important;\n  min-width: 0 !important;\n  max-width: 56% !important;\n}\n'''
          assert css.count(old_corr_css) == 1
          css = css.replace(old_corr_css, new_corr_css, 1)

          css = css.replace('[class*="st-key-fc_apply_row_mobile"]', '[class*="fc_apply_row_mobile"]')
          css = css.replace('[class*="st-key-fc_apply_value_mobile"]', '[class*="fc_apply_value_mobile"]')
          css = css.replace('[class*="st-key-fc_apply_action_mobile"]', '[class*="fc_apply_action_mobile"]')
          assert 'st-key-fc_apply_row_mobile' not in css
          assert 'st-key-fc_apply_value_mobile' not in css
          assert 'st-key-fc_apply_action_mobile' not in css

          old_row = '''  box-sizing: border-box !important;\n  width: 100% !important;\n  min-width: 0 !important;\n  gap: 0 !important;\n  align-items: stretch !important;\n  overflow: hidden !important;\n'''
          new_row = '''  box-sizing: border-box !important;\n  width: 100% !important;\n  min-width: 0 !important;\n  height: 2.25rem !important;\n  min-height: 2.25rem !important;\n  max-height: 2.25rem !important;\n  gap: 0 !important;\n  align-items: center !important;\n  overflow: hidden !important;\n'''
          assert css.count(old_row) == 1
          css = css.replace(old_row, new_row, 1)

          old_result = '''  min-height: 2.55rem;\n  padding: 0.38rem 0.55rem;\n  font-size: 0.92rem;\n'''
          new_result = '''  height: 2.25rem;\n  min-height: 2.25rem;\n  max-height: 2.25rem;\n  padding: 0 0.52rem;\n  font-size: 0.88rem;\n'''
          assert css.count(old_result) == 1
          css = css.replace(old_result, new_result, 1)

          old_button = '''  min-height: 2.55rem !important;\n  height: 100% !important;\n  margin: 0 !important;\n  padding: 0 0.72rem !important;\n'''
          new_button = '''  height: 2.25rem !important;\n  min-height: 2.25rem !important;\n  max-height: 2.25rem !important;\n  margin: 0 !important;\n  padding: 0 0.52rem !important;\n'''
          assert css.count(old_button) == 1
          css = css.replace(old_button, new_button, 1)

          wrapper_css = '''\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="fc_apply_action_mobile"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="fc_apply_action_mobile"] > [data-testid="stVerticalBlock"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="fc_apply_action_mobile"] [data-testid="stElementContainer"],\nbody:has([class*="st-key-stima_cautelativa_beta"])\n[class*="fc_apply_action_mobile"] [data-testid="stButton"] {\n  height: 2.25rem !important;\n  min-height: 2.25rem !important;\n  max-height: 2.25rem !important;\n  margin: 0 !important;\n  padding: 0 !important;\n}\n'''
          marker = '\n.mortem-fc-weight-note-mobile {'
          assert marker in css
          css = css.replace(marker, wrapper_css + marker, 1)
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Check diff and syntax
        shell: bash
        run: |
          git diff --check
          python -m compileall -q app/full_factor_panel.py app/full_mobile_compact.py
          python - <<'PY'
          from pathlib import Path
          panel = Path('app/full_factor_panel.py').read_text(encoding='utf-8')
          css = Path('app/full_mobile_compact.py').read_text(encoding='utf-8')
          assert 'width="stretch",\n                key=k("vest_group")' in panel
          assert 'with st.container(width="content", key=k("corr_slot"))' in panel
          assert 'FC suggerito:&nbsp;' in panel
          assert '[class*="fc_apply_row_mobile"]' in css
          assert 'height: 2.25rem !important;' in css
          PY
          git diff -- app/full_factor_panel.py app/full_mobile_compact.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/full_factor_panel.py app/full_mobile_compact.py
          git commit -m "Rifinisce correnti e risultato FC mobile"
          git push origin HEAD:tmp-mobile-corr-fc-refine-last
