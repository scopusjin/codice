name: Temporary supra desktop compact

on:
  push:
    branches:
      - refactor-tanatology-keys
    paths:
      - .tmp_supra_desktop_compact.py

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor-tanatology-keys
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply desktop compactness
        run: python .tmp_supra_desktop_compact.py

      - name: Compile Python sources
        run: python -m compileall -q app Stima_epoca_decesso.py pages

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Commit revision and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp_supra_desktop_compact.yml .tmp_supra_desktop_compact.py
          git add app/supra_single_grid.py app/special_heading_ui.py
          git commit -m "Estende compattezza sopraciliare al desktop"
          git push origin HEAD:refactor-tanatology-keys
