name: Temporary mobile prudent single suggest

on:
  push:
    branches:
      - tmp-mobile-prudent-single-suggest

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mobile-prudent-single-suggest
          fetch-depth: 0

      - name: Apply exact mobile patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import indent

          # 1) Full: costruzione mobile strutturale della modalità con intervalli.
          stima_path = Path('Stima_epoca_decesso.py')
          stima = stima_path.read_text(encoding='utf-8')
          start_marker = '            # Riga 1: T. rettale, T. ante-mortem, Peso + switch ±3 kg\n'
          end_marker = '            st.session_state["toggle_fattore"] = st.session_state.get("toggle_fattore_inline", False)\n'
          assert stima.count(start_marker) == 1
          start = stima.index(start_marker)
          end = stima.index(end_marker, start) + len(end_marker)
          desktop_block = stima[start:end]

          mobile_block = '''            if full_mobile:\n                with st.container(gap="xsmall", key="cooling_prudent_v2_stack_mobile"):\n                    rectal_label = i18n.ui_text("full.rectal_temp_label")\n                    st.number_input(\n                        rectal_label,\n                        value=sget("rt_val", 35.0), step=0.1, format="%.1f",\n                        key="rt_val", label_visibility="collapsed"\n                    )\n                    st.number_input(\n                        i18n.ui_text("full.antemortem_temp_estimated_label"),\n                        value=sget("tm_val", 37.2), step=0.1, format="%.1f",\n                        key="tm_val", label_visibility="collapsed"\n                    )\n\n                    with st.container(\n                        horizontal=True,\n                        wrap=False,\n                        horizontal_alignment="distribute",\n                        vertical_alignment="center",\n                        gap="small",\n                        key="prudent_weight_row_mobile",\n                    ):\n                        with st.container(width="stretch", key="prudent_weight_value_mobile"):\n                            st.number_input(\n                                i18n.ui_text("full.weight_label"),\n                                value=sget("peso", 70.0), step=1.0, format="%.1f",\n                                key="peso", label_visibility="collapsed"\n                            )\n                        with st.container(width="content", key="prudent_weight_uncertainty_mobile"):\n                            st.toggle(i18n.ui_text("full.weight_uncertainty"), key="peso_stimato_beta")\n\n                    ta_base_val = st.number_input(\n                        i18n.ui_text("full.ta_base_input"),\n                        value=sget("ta_base_val", 20.0),\n                        step=0.1, format="%.1f",\n                        key="ta_base_val",\n                        label_visibility="collapsed"\n                    )\n                    ta_other_val = st.number_input(\n                        i18n.ui_text("full.ta_other_input"),\n                        value=sget("ta_other_val", ta_base_val),\n                        step=0.1, format="%.1f",\n                        key="ta_other_val",\n                        label_visibility="collapsed"\n                    )\n                    ta_values = [\n                        st.session_state.get("ta_base_val"),\n                        st.session_state.get("ta_other_val"),\n                    ]\n                    if all(_is_num(v) for v in ta_values):\n                        lo_ta, hi_ta = sorted(float(v) for v in ta_values)\n                        st.session_state["Ta_min_beta"], st.session_state["Ta_max_beta"] = lo_ta, hi_ta\n                    else:\n                        st.session_state.pop("Ta_min_beta", None)\n                        st.session_state.pop("Ta_max_beta", None)\n\n                    fc_min_val = st.number_input(\n                        i18n.ui_text("full.fc_min_input"),\n                        value=sget("fc_min_val", sget("fattore_correzione", 1.0)),\n                        step=0.1, format="%.2f",\n                        key="fc_min_val",\n                        label_visibility="collapsed"\n                    )\n                    fc_other_val = st.number_input(\n                        i18n.ui_text("full.fc_max_input"),\n                        value=sget("fc_other_val", sget("fattore_correzione", 1.0)),\n                        step=0.1, format="%.2f",\n                        key="fc_other_val",\n                        label_visibility="collapsed"\n                    )\n                    fc_values = [\n                        st.session_state.get("fc_min_val"),\n                        st.session_state.get("fc_other_val"),\n                    ]\n                    if all(_is_num(v) for v in fc_values):\n                        lo_fc, hi_fc = sorted(float(v) for v in fc_values)\n                        st.session_state["FC_min_beta"], st.session_state["FC_max_beta"] = lo_fc, hi_fc\n                    else:\n                        st.session_state.pop("FC_min_beta", None)\n                        st.session_state.pop("FC_max_beta", None)\n\n                    # Un solo pannello di suggerimento per l'intero intervallo FC.\n                    # Nessun target min/max: add_fc_suggestion_global usa la logica\n                    # già esistente per creare/aggiornare gli estremi del range.\n                    st.session_state.pop("__full_fc_suggest_target", None)\n                    suggest_open = bool(st.session_state.get("toggle_fattore_inline", False))\n                    with st.container(\n                        horizontal=True,\n                        wrap=False,\n                        horizontal_alignment="right",\n                        vertical_alignment="center",\n                        gap="small",\n                        key="prudent_fc_suggest_row_mobile",\n                    ):\n                        if st.button(\n                            i18n.ui_text("full.suggest_fc"),\n                            type="primary" if suggest_open else "secondary",\n                            key="prudent_fc_suggest_button_mobile",\n                        ):\n                            suggest_open = not suggest_open\n                            st.session_state["toggle_fattore_inline"] = suggest_open\n                            st.session_state["toggle_fattore"] = suggest_open\n\n                    st.session_state["toggle_fattore"] = bool(\n                        st.session_state.get("toggle_fattore_inline", False)\n                    )\n            else:\n'''
          stima = stima[:start] + mobile_block + indent(desktop_block, '    ') + stima[end:]
          stima_path.write_text(stima, encoding='utf-8')

          # 2) V2: niente più Consiglia separato su FC min e FC max.
          init_path = Path('app/__init__.py')
          init = init_path.read_text(encoding='utf-8')
          old_targets = '''        suggest_target = None\n        if compact_mobile:\n            if key == "fattore_correzione" and (not prudent_mode or not range_mode):\n                suggest_target = "single"\n            elif prudent_mode and range_mode and key == "fc_min_val":\n                suggest_target = "min"\n            elif prudent_mode and range_mode and key == "fc_other_val":\n                suggest_target = "max"\n'''
          new_targets = '''        suggest_target = None\n        if compact_mobile:\n            if key == "fattore_correzione" and (not prudent_mode or not range_mode):\n                suggest_target = "single"\n'''
          assert init.count(old_targets) == 1
          init = init.replace(old_targets, new_targets, 1)
          init_path.write_text(init, encoding='utf-8')

          # 3) V2: helper temperatura immediatamente dopo l'etichetta.
          v2_path = Path('app/decimal_number_input_v2.py')
          v2 = v2_path.read_text(encoding='utf-8')
          label_rule_end = '''  line-height: 1.1;\n}\n.number-input {\n'''
          label_rule_new = '''  line-height: 1.1;\n}\n.number-control.has-help .mobile-label {\n  flex: 0 1 auto;\n}\n.number-control.has-help .number-input {\n  margin-left: auto;\n}\n.number-input {\n'''
          assert v2.count(label_rule_end) == 1
          v2 = v2.replace(label_rule_end, label_rule_new, 1)
          js_help = '''  const showHelp = Boolean(data?.help_enabled);\n  const showSuggest = Boolean(data?.suggest_enabled);\n'''
          js_help_new = '''  const showHelp = Boolean(data?.help_enabled);\n  const showSuggest = Boolean(data?.suggest_enabled);\n  control.classList.toggle('has-help', showHelp);\n'''
          assert v2.count(js_help) == 1
          v2 = v2.replace(js_help, js_help_new, 1)
          v2_path.write_text(v2, encoding='utf-8')

          # 4) Risultato FC standard mobile: nota peso dentro lo stesso blocco.
          panel_path = Path('app/full_factor_panel.py')
          panel = panel_path.read_text(encoding='utf-8')
          block_start = '    if full_mobile and not range_mode:\n'
          block_end = '    else:\n        _fc_box(result.fattore_finale, result.fattore_base, peso_eff)\n'
          assert panel.count(block_start) == 1
          p_start = panel.index(block_start)
          p_end = panel.index(block_end, p_start)
          new_panel_block = '''    if full_mobile and not range_mode:\n        side_text = ""\n        if (\n            result.fattore_base is not None\n            and peso_eff is not None\n            and abs(result.fattore_finale - result.fattore_base) > 1e-9\n        ):\n            side_text = i18n.ui_text(\n                "full.fc_adjusted_for_weight", weight=peso_eff, base=result.fattore_base\n            )\n\n        with st.container(border=False, key=f"{key_prefix}_fc_apply_block_mobile"):\n            with st.container(\n                horizontal=True,\n                wrap=False,\n                horizontal_alignment="distribute",\n                vertical_alignment="center",\n                gap=None,\n                key=f"{key_prefix}_fc_apply_row_mobile",\n            ):\n                with st.container(width="stretch", key=f"{key_prefix}_fc_apply_value_mobile"):\n                    st.markdown(\n                        f'<div class="mortem-fc-inline-result">FC suggerito:&nbsp;<strong>{result.fattore_finale:.2f}</strong></div>',\n                        unsafe_allow_html=True,\n                    )\n                with st.container(width="content", key=f"{key_prefix}_fc_apply_action_mobile"):\n                    st.button(\n                        "→ Usa",\n                        type="secondary",\n                        on_click=_apply_fc, args=(result.fattore_finale, result.riassunto),\n                        key=f"{key_prefix}_btn_usa_fc{suffix}",\n                    )\n            if side_text:\n                st.markdown(\n                    f'<div class="mortem-fc-weight-note-mobile">{side_text}</div>',\n                    unsafe_allow_html=True,\n                )\n'''
          panel = panel[:p_start] + new_panel_block + panel[p_end:]
          panel_path.write_text(panel, encoding='utf-8')

          # 5) CSS mobile: stack prudente + blocco risultato realmente unico.
          compact_path = Path('app/full_mobile_compact.py')
          compact = compact_path.read_text(encoding='utf-8')
          css_start = '/* Risultato FC standard mobile: valore e azione su una sola riga. */\n'
          css_end = '/* Il selettore della superficie deve distinguersi chiaramente dagli stepper. */\n'
          assert compact.count(css_start) == 1
          c_start = compact.index(css_start)
          c_end = compact.index(css_end, c_start)
          css_new = r'''/* Modalità Condizioni variabili: V2 a piena larghezza e azioni compatte. */
body:has([class*="st-key-stima_cautelativa_beta"])
[class*="st-key-cooling_prudent_v2_stack_mobile"] {
  width: 100% !important;
  min-width: 0 !important;
  gap: 0.18rem !important;
}

body:has([class*="st-key-stima_cautelativa_beta"])
[class*="st-key-prudent_weight_row_mobile"] {
  width: 100% !important;
  min-width: 0 !important;
  flex-wrap: nowrap !important;
  align-items: center !important;
  gap: 0.28rem !important;
}

body:has([class*="st-key-stima_cautelativa_beta"])
[class*="st-key-prudent_weight_value_mobile"] {
  flex: 1 1 auto !important;
  width: auto !important;
  min-width: 0 !important;
}

body:has([class*="st-key-stima_cautelativa_beta"])
[class*="st-key-prudent_weight_uncertainty_mobile"] {
  flex: 0 0 auto !important;
  width: max-content !important;
  min-width: max-content !important;
}

body:has([class*="st-key-stima_cautelativa_beta"])
[class*="st-key-prudent_fc_suggest_row_mobile"] {
  width: 100% !important;
  min-width: 0 !important;
  justify-content: flex-end !important;
  margin: 0.02rem 0 0 0 !important;
  padding: 0 !important;
}

body:has([class*="st-key-stima_cautelativa_beta"])
[class*="st-key-prudent_fc_suggest_button_mobile"] button {
  min-height: 2.0rem !important;
  height: 2.0rem !important;
  padding: 0 0.72rem !important;
  border-radius: 0.48rem !important;
  white-space: nowrap !important;
}

/* Risultato FC standard mobile: valore, azione e nota peso in un solo blocco. */
body:has([class*="st-key-stima_cautelativa_beta"])
[class*="fc_apply_block_mobile"] {
  box-sizing: border-box !important;
  width: 100% !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding: 0.08rem 0.10rem 0.10rem !important;
  border: 1px solid color-mix(in srgb, var(--st-primary-color) 70%, transparent) !important;
  border-radius: 0.58rem !important;
  background: color-mix(in srgb, var(--st-secondary-background-color) 82%, var(--st-primary-color) 18%) !important;
  overflow: hidden !important;
}

body:has([class*="st-key-stima_cautelativa_beta"])
[class*="fc_apply_block_mobile"] > [data-testid="stVerticalBlock"] {
  gap: 0.02rem !important;
}

body:has([class*="st-key-stima_cautelativa_beta"])
[class*="fc_apply_row_mobile"] {
  box-sizing: border-box !important;
  width: 100% !important;
  min-width: 0 !important;
  height: 2.15rem !important;
  min-height: 2.15rem !important;
  max-height: 2.15rem !important;
  gap: 0 !important;
  align-items: center !important;
  overflow: hidden !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
}

body:has([class*="st-key-stima_cautelativa_beta"])
[class*="fc_apply_value_mobile"] {
  flex: 1 1 auto !important;
  min-width: 0 !important;
  margin: 0 !important;
  padding: 0 !important;
}

.mortem-fc-inline-result {
  box-sizing: border-box;
  display: flex;
  align-items: center;
  height: 2.15rem;
  min-height: 2.15rem;
  max-height: 2.15rem;
  padding: 0 0.48rem;
  font-size: 0.88rem;
  line-height: 1.1;
  font-weight: 600;
  color: var(--st-text-color);
  white-space: nowrap;
}

body:has([class*="st-key-stima_cautelativa_beta"])
[class*="fc_apply_action_mobile"] {
  flex: 0 0 auto !important;
  width: max-content !important;
  min-width: max-content !important;
  margin: 0 !important;
  padding: 0 !important;
}

body:has([class*="st-key-stima_cautelativa_beta"])
[class*="fc_apply_action_mobile"] button {
  height: 1.86rem !important;
  min-height: 1.86rem !important;
  max-height: 1.86rem !important;
  margin: 0 0.12rem 0 0 !important;
  padding: 0 0.58rem !important;
  border: 1px solid var(--st-primary-color) !important;
  border-radius: 0.44rem !important;
  background: color-mix(in srgb, var(--st-primary-color) 13%, var(--st-secondary-background-color)) !important;
  color: var(--st-text-color) !important;
  font-weight: 650 !important;
  white-space: nowrap !important;
}

body:has([class*="st-key-stima_cautelativa_beta"])
[class*="fc_apply_action_mobile"] button p,
body:has([class*="st-key-stima_cautelativa_beta"])
[class*="fc_apply_action_mobile"] button span {
  color: var(--st-text-color) !important;
  font-weight: 650 !important;
}

body:has([class*="st-key-stima_cautelativa_beta"])
[class*="fc_apply_action_mobile"],
body:has([class*="st-key-stima_cautelativa_beta"])
[class*="fc_apply_action_mobile"] > [data-testid="stVerticalBlock"],
body:has([class*="st-key-stima_cautelativa_beta"])
[class*="fc_apply_action_mobile"] [data-testid="stElementContainer"],
body:has([class*="st-key-stima_cautelativa_beta"])
[class*="fc_apply_action_mobile"] [data-testid="stButton"] {
  height: 2.15rem !important;
  min-height: 2.15rem !important;
  max-height: 2.15rem !important;
  margin: 0 !important;
  padding: 0 !important;
  display: flex !important;
  align-items: center !important;
  justify-content: flex-end !important;
}

.mortem-fc-weight-note-mobile {
  box-sizing: border-box;
  width: 100%;
  margin: 0 !important;
  padding: 0 0.48rem 0.12rem !important;
  font-size: 0.76rem;
  line-height: 1.20;
  white-space: normal;
  overflow: visible;
  color: var(--st-text-color);
}

body:has([class*="st-key-stima_cautelativa_beta"])
[data-testid="stElementContainer"]:has(.mortem-fc-weight-note-mobile) {
  width: 100% !important;
  overflow: visible !important;
  margin: 0 !important;
  padding: 0 !important;
}

'''
          compact = compact[:c_start] + css_new + compact[c_end:]
          compact_path.write_text(compact, encoding='utf-8')
          PY

      - name: Check diff and syntax
        shell: bash
        run: |
          git diff --check
          python -m compileall -q Stima_epoca_decesso.py app/__init__.py app/decimal_number_input_v2.py app/full_factor_panel.py app/full_mobile_compact.py
          python - <<'PY'
          from pathlib import Path
          stima = Path('Stima_epoca_decesso.py').read_text(encoding='utf-8')
          init = Path('app/__init__.py').read_text(encoding='utf-8')
          v2 = Path('app/decimal_number_input_v2.py').read_text(encoding='utf-8')
          panel = Path('app/full_factor_panel.py').read_text(encoding='utf-8')
          compact = Path('app/full_mobile_compact.py').read_text(encoding='utf-8')
          assert 'key="cooling_prudent_v2_stack_mobile"' in stima
          assert 'key="prudent_fc_suggest_button_mobile"' in stima
          assert 'suggest_target = "min"' not in init
          assert 'suggest_target = "max"' not in init
          assert "control.classList.toggle('has-help', showHelp);" in v2
          assert 'key=f"{key_prefix}_fc_apply_block_mobile"' in panel
          assert 'type="secondary"' in panel
          assert '[class*="fc_apply_block_mobile"]' in compact
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Stima_epoca_decesso.py app/__init__.py app/decimal_number_input_v2.py app/full_factor_panel.py app/full_mobile_compact.py
          git diff --cached --quiet && exit 0
          git commit -m "Compatta condizioni variabili mobile"
          git push origin HEAD:tmp-mobile-prudent-single-suggest
