name: Temporary mobile prudent single suggest

on:
  push:
    branches:
      - tmp-mobile-prudent-single-suggest

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mobile-prudent-single-suggest
          fetch-depth: 0

      - name: Apply exact mobile patch
        shell: bash
        run: python .github/scripts/tmp_mobile_prudent_patch.py

      - name: Check diff and syntax
        shell: bash
        run: |
          git diff --check
          python -m compileall -q Stima_epoca_decesso.py app/__init__.py app/decimal_number_input_v2.py app/full_factor_panel.py app/full_mobile_compact.py
          python - <<'PY'
          from pathlib import Path
          stima = Path('Stima_epoca_decesso.py').read_text(encoding='utf-8')
          init = Path('app/__init__.py').read_text(encoding='utf-8')
          v2 = Path('app/decimal_number_input_v2.py').read_text(encoding='utf-8')
          panel = Path('app/full_factor_panel.py').read_text(encoding='utf-8')
          compact = Path('app/full_mobile_compact.py').read_text(encoding='utf-8')
          assert 'key="cooling_prudent_v2_stack_mobile"' in stima
          assert 'suggest_target = "min"' not in init
          assert 'suggest_target = "max"' not in init
          assert 'suggest_target = "range"' in init
          assert "control.classList.toggle('has-help', showHelp);" in v2
          assert 'vals[0]-0.10' not in panel
          assert 'anchor = max(current_bounds' in panel
          assert 'key=f"{key_prefix}_fc_apply_block_mobile"' in panel
          assert 'type="secondary"' in panel
          assert '[class*="fc_apply_block_mobile"]' in compact
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Stima_epoca_decesso.py app/__init__.py app/decimal_number_input_v2.py app/full_factor_panel.py app/full_mobile_compact.py
          git diff --cached --quiet && exit 0
          git commit -m "Compatta condizioni variabili mobile"
          git push origin HEAD:tmp-mobile-prudent-single-suggest
