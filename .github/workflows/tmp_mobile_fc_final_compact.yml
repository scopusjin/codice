name: Temporary mobile FC final compact

on:
  push:
    branches:
      - tmp-mobile-fc-final-compact

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mobile-fc-final-compact
          fetch-depth: 0

      - name: Fix supported container alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/full_factor_panel.py')
          text = p.read_text(encoding='utf-8')
          old = '''            vertical_alignment="stretch",\n            gap=None,\n            key=f"{key_prefix}_fc_apply_row_mobile",\n'''
          new = '''            vertical_alignment="center",\n            gap=None,\n            key=f"{key_prefix}_fc_apply_row_mobile",\n'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY

      - name: Check diff and syntax
        shell: bash
        run: |
          git diff --check
          python -m compileall -q app/full_factor_panel.py
          python - <<'PY'
          from pathlib import Path
          text = Path('app/full_factor_panel.py').read_text(encoding='utf-8')
          assert 'vertical_alignment="stretch"' not in text
          assert 'vertical_alignment="center"' in text
          PY

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/full_factor_panel.py
          git commit -m "Corregge allineamento FC mobile"
          git push origin HEAD:tmp-mobile-fc-final-compact
