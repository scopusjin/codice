name: Temporary Swisswuff wording patch

on:
  push:
    branches:
      - refactor-tanatology-keys
    paths:
      - .github/tmp_swisswuff_wording_trigger.txt

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: refactor-tanatology-keys
          fetch-depth: 0

      - name: Apply wording patch
        run: python .github/tmp_swisswuff_wording_patch.py

      - name: Check diff and syntax
        run: |
          git diff --check
          python -m py_compile app/graphing.py

      - name: Commit wording update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/graphing.py
          git diff --cached --quiet && { echo "No application change produced"; exit 1; }
          git commit -m "Aggiorna formulazione Swisswuff"
          git push origin HEAD:refactor-tanatology-keys
