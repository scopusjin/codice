name: Temporary mobile FC polish

on:
  push:
    branches:
      - tmp-mobile-fc-polish-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mobile-fc-polish-v2
          fetch-depth: 0

      - name: Apply exact mobile FC polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          panel_path = Path('app/full_factor_panel.py')
          panel = panel_path.read_text(encoding='utf-8')

          old = '_FULL_MOBILE_SURFACE_PLACEHOLDER = "Superficie di appoggio"'
          new = '_FULL_MOBILE_SURFACE_PLACEHOLDER = "Superficie di appoggio ?"'
          assert panel.count(old) == 1
          panel = panel.replace(old, new, 1)

          old = '''            with st.container(width="content", key=k("vest_slot")):\n                toggle_vestito = st.toggle(\n                    "Vestiti/coperte",\n                    key=k("toggle_vestito"), value=False\n                )\n            with st.container(width="content", key=k("corr_slot")):\n                corr_placeholder = st.empty()'''
          new = '''            with st.container(width="content", key=k("vest_slot")):\n                toggle_vestito = st.toggle(\n                    "Vestiti/coperte",\n                    key=k("toggle_vestito"), value=False\n                )\n            with st.container(width="content", key=k("vest_help_slot")):\n                with st.popover("?"):\n                    st.markdown(\n                        """\n                        <div class="mortem-help-copy">\n                          <div class="mortem-help-copy-intro">Esempi orientativi per distinguere gli strati:</div>\n                          <div class="mortem-help-copy-bullet">• Strati leggeri: T-shirt, camicia, lenzuolo o telo sottile.</div>\n                          <div class="mortem-help-copy-bullet">• Strati pesanti: maglione, felpa pesante, giacca o telo spesso.</div>\n                          <div class="mortem-help-copy-bullet">• Coperte medie: coperta di normale spessore.</div>\n                          <div class="mortem-help-copy-bullet">• Coperte pesanti/termiche: piumone pesante o mantellina/coperta termica.</div>\n                          <div class="mortem-help-copy-intro">Conta separatamente gli strati effettivamente presenti sul corpo.</div>\n                        </div>\n                        """,\n                        unsafe_allow_html=True,\n                    )\n            with st.container(width="content", key=k("corr_slot")):\n                corr_placeholder = st.empty()'''
          assert panel.count(old) == 1
          panel = panel.replace(old, new, 1)

          replacements = {
              '''            n_sottili = _safe_int(st.number_input(\n                label_sottili,''': '''            n_sottili = _safe_int(st.number_input(\n                "Strati leggeri",''',
              '''            n_spessi = _safe_int(st.number_input(\n                label_spessi,''': '''            n_spessi = _safe_int(st.number_input(\n                "Strati pesanti",''',
              '''                n_cop_medie = _safe_int(st.number_input(\n                    label_coperte_medie,''': '''                n_cop_medie = _safe_int(st.number_input(\n                    "Coperte medie",''',
              '''                n_cop_pesanti = _safe_int(st.number_input(\n                    label_coperte_pesanti,''': '''                n_cop_pesanti = _safe_int(st.number_input(\n                    "Coperte pesanti/termiche",''',
          }
          for old, new in replacements.items():
              assert panel.count(old) == 1
              panel = panel.replace(old, new, 1)

          old = '''        superficie_display_label = st.selectbox(\n            i18n.ui_text(f"{scope}.support_surface"),\n            select_options,\n            **select_kwargs\n        )'''
          new = '''        if full_mobile:\n            with st.container(key=k("surface_select_mobile")):\n                superficie_display_label = st.selectbox(\n                    i18n.ui_text(f"{scope}.support_surface"),\n                    select_options,\n                    **select_kwargs\n                )\n        else:\n            superficie_display_label = st.selectbox(\n                i18n.ui_text(f"{scope}.support_surface"),\n                select_options,\n                **select_kwargs\n            )'''
          assert panel.count(old) == 1
          panel = panel.replace(old, new, 1)
          panel_path.write_text(panel, encoding='utf-8')

          v2_path = Path('app/decimal_number_input_v2.py')
          v2 = v2_path.read_text(encoding='utf-8')

          exact = [
              ('padding: 0 6px 0 10px;', 'padding: 0 4px 0 8px;'),
              ('flex: 0 0 66px;\n  width: 66px;\n  min-width: 66px;', 'flex: 0 0 58px;\n  width: 58px;\n  min-width: 58px;'),
              ('padding: 0 4px;\n  text-align: left;', 'padding: 0 5px 0 2px;\n  text-align: right;'),
              ('flex: 0 0 34px;\n  width: 34px;', 'flex: 0 0 32px;\n  width: 32px;'),
              ('flex: 0 0 24px;\n  width: 24px;', 'flex: 0 0 22px;\n  width: 22px;'),
              ('padding: 0 7px;', 'padding: 0 6px;'),
              ('flex-basis: 60px;\n  width: 60px;\n  min-width: 60px;', 'flex-basis: 58px;\n  width: 58px;\n  min-width: 58px;'),
          ]
          for old, new in exact:
              assert v2.count(old) == 1
              v2 = v2.replace(old, new, 1)

          marker = '.number-control.is-disabled { opacity: 0.65; }\n'
          dense_css = '''.number-control.is-disabled { opacity: 0.65; }\n.number-control.is-dense {\n  height: 34px;\n  border-radius: 7px;\n}\n.number-control.is-dense .mobile-label {\n  padding-left: 8px;\n  font-size: 0.79rem;\n}\n.number-control.is-dense .number-input {\n  flex-basis: 38px;\n  width: 38px;\n  min-width: 38px;\n  padding-right: 4px;\n  font-size: 0.90rem;\n}\n.number-control.is-dense .step-button {\n  flex-basis: 30px;\n  width: 30px;\n  font-size: 1.02rem;\n}\n'''
          assert v2.count(marker) == 1
          v2 = v2.replace(marker, dense_css, 1)

          old = '''  const showHelp = Boolean(data?.help_enabled);\n  const showSuggest = Boolean(data?.suggest_enabled);\n  control.classList.toggle('has-suggest', showSuggest);'''
          new = '''  const showHelp = Boolean(data?.help_enabled);\n  const showSuggest = Boolean(data?.suggest_enabled);\n  const dense = Boolean(data?.dense);\n  control.classList.toggle('has-suggest', showSuggest);\n  control.classList.toggle('is-dense', dense);'''
          assert v2.count(old) == 1
          v2 = v2.replace(old, new, 1)

          old = '''    sync_key = f"{internal_key}:sync-token"\n    sync_token = int(sync_token)\n'''
          new = '''    sync_key = f"{internal_key}:sync-token"\n    sync_token = int(sync_token)\n    dense = bool(key and key.startswith("mortem_decimal_fcpanel_"))\n'''
          assert v2.count(old) == 1
          v2 = v2.replace(old, new, 1)

          old = '''            "suggest_active": bool(suggest_active),\n        },'''
          new = '''            "suggest_active": bool(suggest_active),\n            "dense": dense,\n        },'''
          assert v2.count(old) == 1
          v2 = v2.replace(old, new, 1)

          old = '''        width="stretch",\n        height=40,\n    )'''
          new = '''        width="stretch",\n        height=34 if dense else 40,\n    )'''
          assert v2.count(old) == 1
          v2 = v2.replace(old, new, 1)
          v2_path.write_text(v2, encoding='utf-8')

          compact_path = Path('app/full_mobile_compact.py')
          compact = compact_path.read_text(encoding='utf-8')
          marker = '''  body:has([class*="st-key-stima_cautelativa_beta"])\n  [class*="st-key-full_fc_panel_mobile"] [class*="st-key-fcpanel_caut_switch_row"] {\n    margin-top: -0.12rem !important;\n    margin-bottom: -0.12rem !important;\n    padding-top: 0 !important;\n    padding-bottom: 0 !important;\n  }\n'''
          addition = marker + '''\n  /* I quattro stepper vestiti sono volutamente più bassi degli altri V2. */\n  body:has([class*="st-key-stima_cautelativa_beta"])\n  [class*="st-key-mortem_decimal_fcpanel_"] {\n    height: 34px !important;\n    min-height: 34px !important;\n  }\n\n  body:has([class*="st-key-stima_cautelativa_beta"])\n  [class*="st-key-mortem_decimal_fcpanel_"] iframe {\n    display: block !important;\n    height: 34px !important;\n    min-height: 34px !important;\n    max-height: 34px !important;\n  }\n\n  body:has([class*="st-key-stima_cautelativa_beta"])\n  [class*="st-key-fcpanel_std_vest_help_slot"] button,\n  body:has([class*="st-key-stima_cautelativa_beta"])\n  [class*="st-key-fcpanel_caut_vest_help_slot"] button {\n    width: 1.42rem !important;\n    min-width: 1.42rem !important;\n    height: 1.42rem !important;\n    min-height: 1.42rem !important;\n    padding: 0 !important;\n    border-radius: 50% !important;\n  }\n\n  body:has([class*="st-key-stima_cautelativa_beta"])\n  [class*="st-key-fcpanel_std_vest_help_slot"] button p,\n  body:has([class*="st-key-stima_cautelativa_beta"])\n  [class*="st-key-fcpanel_caut_vest_help_slot"] button p {\n    margin: 0 !important;\n    font-size: 0.74rem !important;\n    line-height: 1 !important;\n  }\n\n  /* La superficie resta un controllo distinto dal conteggio degli strati. */\n  body:has([class*="st-key-stima_cautelativa_beta"])\n  [class*="st-key-fcpanel_std_surface_select_mobile"] [data-testid="stSelectbox"] [data-baseweb="select"] > div,\n  body:has([class*="st-key-stima_cautelativa_beta"])\n  [class*="st-key-fcpanel_caut_surface_select_mobile"] [data-testid="stSelectbox"] [data-baseweb="select"] > div {\n    background: color-mix(in srgb, var(--st-secondary-background-color) 86%, var(--st-primary-color) 14%) !important;\n    border-color: color-mix(in srgb, var(--st-primary-color) 38%, transparent) !important;\n  }\n'''
          assert compact.count(marker) == 1
          compact = compact.replace(marker, addition, 1)
          compact_path.write_text(compact, encoding='utf-8')
          PY

      - name: Check diff and syntax
        shell: bash
        run: |
          git diff --check
          python -m compileall -q app/full_factor_panel.py app/decimal_number_input_v2.py app/full_mobile_compact.py
          python - <<'PY'
          from pathlib import Path
          panel = Path('app/full_factor_panel.py').read_text(encoding='utf-8')
          v2 = Path('app/decimal_number_input_v2.py').read_text(encoding='utf-8')
          compact = Path('app/full_mobile_compact.py').read_text(encoding='utf-8')
          assert 'Superficie di appoggio ?' in panel
          assert 'Esempi orientativi per distinguere gli strati:' in panel
          for label in ('Strati leggeri', 'Strati pesanti', 'Coperte medie', 'Coperte pesanti/termiche'):
              assert label in panel
          assert 'height=34 if dense else 40' in v2
          assert "control.classList.toggle('is-dense', dense);" in v2
          assert 'text-align: right;' in v2
          assert '[class*="st-key-mortem_decimal_fcpanel_"] iframe' in compact
          assert 'surface_select_mobile' in compact
          PY
          git diff -- app/full_factor_panel.py app/decimal_number_input_v2.py app/full_mobile_compact.py

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/full_factor_panel.py app/decimal_number_input_v2.py app/full_mobile_compact.py
          git commit -m "Compatta e rifinisce pannello FC mobile"
          git push origin HEAD:tmp-mobile-fc-polish-v2
