name: Temporary mobile FC align Usalo

on:
  push:
    branches:
      - tmp-mobile-fc-align-usalo-do5

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mobile-fc-align-usalo-do5
          fetch-depth: 0

      - name: Patch V2 FC alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/decimal_number_input_v2.py')
          s = p.read_text(encoding='utf-8')

          old = '.suggest-button.is-visible {\n  display: flex;\n  flex: 0 0 auto;\n'
          new = '.suggest-button.is-visible,\n.number-control.reserve-suggest .suggest-button {\n  display: flex;\n  flex: 0 0 5.4rem;\n  width: 5.4rem;\n  min-width: 5.4rem;\n'
          assert old in s
          s = s.replace(old, new, 1)

          anchor = '}\n.number-control.has-suggest .number-input {'
          assert anchor in s
          s = s.replace(anchor, '}\n.number-control.reserve-suggest .suggest-button {\n  visibility: hidden;\n  pointer-events: none;\n}\n.number-control.has-suggest .number-input {', 1)

          old = "  const showSuggest = Boolean(data?.suggest_enabled);\n  control.classList.toggle('has-help', showHelp);"
          assert old in s
          s = s.replace(old, "  const showSuggest = Boolean(data?.suggest_enabled);\n  const reserveSuggest = Boolean(data?.reserve_suggest);\n  control.classList.toggle('has-help', showHelp);", 1)

          old = "  control.classList.toggle('has-suggest', showSuggest);\n"
          assert old in s
          s = s.replace(old, old + "  control.classList.toggle('reserve-suggest', reserveSuggest);\n", 1)

          old = '            "suggest_active": bool(suggest_active),\n            "dense": dense,'
          assert old in s
          s = s.replace(old, '            "suggest_active": bool(suggest_active),\n            "reserve_suggest": key == "mortem_decimal_fc_min_val",\n            "dense": dense,', 1)

          assert 'number-control.reserve-suggest .suggest-button' in s
          assert 'flex: 0 0 5.4rem;' in s
          assert '"reserve_suggest": key == "mortem_decimal_fc_min_val"' in s
          p.write_text(s, encoding='utf-8')
          PY

      - name: Check V2
        shell: bash
        run: |
          git diff --check
          python -m compileall -q app/decimal_number_input_v2.py

      - name: Commit V2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/decimal_number_input_v2.py
          git diff --cached --quiet && exit 0
          git commit -m "Allinea controlli FC variabili mobile"
          git push origin HEAD:tmp-mobile-fc-align-usalo-do5
