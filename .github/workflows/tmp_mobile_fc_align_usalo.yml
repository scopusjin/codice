name: Temporary mobile FC align Usalo

on:
  push:
    branches:
      - tmp-mobile-fc-align-usalo-do5

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-mobile-fc-align-usalo-do5
          fetch-depth: 0

      - name: Patch Usalo appearance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/full_mobile_compact.py')
          s = p.read_text(encoding='utf-8')
          start = s.index('/* Risultato FC standard mobile: valore, azione e nota peso in un solo blocco. */')
          end = s.index('/* Il selettore della superficie deve distinguersi chiaramente dagli stepper. */', start)
          a, section, b = s[:start], s[start:end], s[end:]

          assert '  gap: 0.34rem !important;' in section
          section = section.replace('  gap: 0.34rem !important;', '  gap: 0.14rem !important;', 1)

          marker = '[class*="fc_apply_action_mobile"] button {'
          pos = section.index(marker)
          tail = section[pos:]
          assert '  border: 1.5px solid var(--st-primary-color) !important;' in tail
          assert '  background: var(--st-secondary-background-color) !important;' in tail
          assert '  color: var(--st-primary-color) !important;' in tail
          tail = tail.replace(
              '  height: 1.86rem !important;',
              '  display: inline-flex !important;\n  align-items: center !important;\n  justify-content: center !important;\n  height: 1.86rem !important;',
              1,
          )
          tail = tail.replace(
              '  border: 1.5px solid var(--st-primary-color) !important;',
              '  border: 1.5px solid var(--st-primary-color, #168AC1) !important;',
              1,
          )
          tail = tail.replace(
              '  background: var(--st-secondary-background-color) !important;',
              '  background: color-mix(in srgb, var(--st-primary-color, #168AC1) 10%, #ffffff) !important;',
              1,
          )
          tail = tail.replace(
              '  color: var(--st-primary-color) !important;',
              '  color: var(--st-text-color, #31333F) !important;',
              1,
          )
          tail = tail.replace(
              '  box-shadow: 0 0 0 1px color-mix(in srgb, var(--st-primary-color) 14%, transparent) !important;',
              '  box-shadow: 0 0 0 1px color-mix(in srgb, var(--st-primary-color, #168AC1) 14%, transparent) !important;',
              1,
          )
          # Testo interno del bottone.
          tail = tail.replace(
              '  color: var(--st-primary-color) !important;',
              '  color: var(--st-text-color, #31333F) !important;',
              1,
          )
          section = section[:pos] + tail

          assert 'gap: 0.14rem !important;' in section
          assert 'border: 1.5px solid var(--st-primary-color, #168AC1) !important;' in section
          assert 'background: color-mix(in srgb, var(--st-primary-color, #168AC1) 10%, #ffffff) !important;' in section
          assert 'display: inline-flex !important;' in section
          p.write_text(a + section + b, encoding='utf-8')
          PY

      - name: Check CSS
        shell: bash
        run: |
          git diff --check
          python -m compileall -q app/full_mobile_compact.py

      - name: Commit CSS
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/full_mobile_compact.py
          git diff --cached --quiet && exit 0
          git commit -m "Rende visibile pulsante Usalo mobile"
          git push origin HEAD:tmp-mobile-fc-align-usalo-do5
