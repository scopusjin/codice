name: Temporary supra self gap fix

on:
  push:
    branches:
      - refactor-tanatology-keys
    paths:
      - .tmp_supra_self_gap.py

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor-tanatology-keys
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply selector fix
        run: python .tmp_supra_self_gap.py

      - name: Compile Python sources
        run: python -m compileall -q app Stima_epoca_decesso.py pages

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Commit revision and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp_supra_self_gap.yml .tmp_supra_self_gap.py
          git add app/supra_single_grid.py
          git commit -m "Corregge selettore gap sopraciliare"
          git push origin HEAD:refactor-tanatology-keys
