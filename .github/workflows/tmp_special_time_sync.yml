name: Temporary special time sync

on:
  push:
    branches:
      - refactor-tanatology-keys
    paths:
      - .tmp_special_time_sync.py

permissions:
  contents: write

jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refactor-tanatology-keys
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply inherited special times
        run: python .tmp_special_time_sync.py

      - name: Check JavaScript syntax
        run: node --check app/native_time_picker_frontend/main.js

      - name: Compile Python sources
        run: python -m compileall -q app Stima_epoca_decesso.py pages

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Commit revision and remove temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp_special_time_sync.yml .tmp_special_time_sync.py
          git add Stima_epoca_decesso.py app/native_time_picker.py app/native_time_picker_frontend/main.js app/native_time_picker_frontend/style.css
          git commit -m "Sincronizza orari tanatologici ereditati"
          git push origin HEAD:refactor-tanatology-keys
