name: Temp date format IT

on:
  push:
    branches:
      - tmp-date-format-it
    paths:
      - .github/workflows/tmp_date_format_it.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-date-format-it
      - name: Apply exact date format patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('Stima_epoca_decesso.py')
          s = p.read_text(encoding='utf-8')
          old = '''                    value=st.session_state["input_data_rilievo"],\n                    label_visibility="collapsed",\n                    key="input_data_rilievo",\n'''
          new = '''                    value=st.session_state["input_data_rilievo"],\n                    format="DD/MM/YYYY",\n                    label_visibility="collapsed",\n                    key="input_data_rilievo",\n'''
          if old not in s:
              raise SystemExit('Expected date_input snippet not found exactly once')
          if s.count(old) != 1:
              raise SystemExit(f'Expected one date_input snippet, found {s.count(old)}')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Verify only expected line changed
        run: |
          git diff --check
          git diff -- Stima_epoca_decesso.py
      - name: Commit patch
        run: |
          git config user.name "scopusjin"
          git config user.email "matteo.moretti19@gmail.com"
          git add Stima_epoca_decesso.py
          git commit -m "Visualizza data in formato italiano"
          git push origin HEAD:tmp-date-format-it
