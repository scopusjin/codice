name: Temporary desktop Full parity run

on:
  push:
    branches:
      - tmp-desktop-full-parity-run

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-desktop-full-parity-run
          fetch-depth: 0
      - name: Apply patch script
        run: python .github/tmp_desktop_full_parity_patch.py
      - name: Check diff and syntax
        run: |
          git diff --check
          python -m compileall -q Stima_epoca_decesso.py app/__init__.py app/decimal_number_input.py app/full_factor_panel.py app/full_mobile_compact.py
          git diff --stat
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Stima_epoca_decesso.py app/__init__.py app/decimal_number_input.py app/full_factor_panel.py app/full_mobile_compact.py
          git diff --cached --quiet && exit 0
          git commit -m "Allinea interfaccia desktop alla Full mobile"
          git push origin HEAD:tmp-desktop-full-parity-run
