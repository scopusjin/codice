name: Regression tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python sources
        run: python -m compileall -q app Stima_epoca_decesso.py pages

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Temporary unused-code scan
        run: |
          python -m pip install --disable-pip-version-check vulture
          echo '=== VULTURE 90 ==='
          vulture Stima_epoca_decesso.py app pages tests --min-confidence 90 || true
          echo '=== VULTURE 80 ==='
          vulture Stima_epoca_decesso.py app pages tests --min-confidence 80 || true
          echo '=== VULTURE 60 ==='
          vulture Stima_epoca_decesso.py app pages tests --min-confidence 60 || true
